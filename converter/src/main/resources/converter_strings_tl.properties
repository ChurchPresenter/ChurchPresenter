# Source format descriptions
source_desc_songbeamer=Mga text file ng SongBeamer — ang pinakamaaasahang pag-import.
source_desc_freeworship=Mga export ng Free Worship — OpenLyrics XML, isang file bawat awit.
source_desc_softprojector=Mga songbook ng SoftProjector — hinahati sa mga indibidwal na awit.
source_desc_openlp=Mga library ng OpenLP — ang mismong songs.sqlite database, o isang export na OpenLyrics.
source_desc_opensong=Mga file ng awit ng OpenSong — XML na may liriko bilang plain text, kadalasang walang extension.
source_desc_freeshow=Mga show ng FreeShow — JSON, binabasa ayon sa pagkakasunod ng aktibong layout.
source_desc_easyslides=Mga export ng EasySlides — isang XML file ang naglalaman ng buong database ng awit.
source_desc_quelea=Mga song pack ng Quelea — isang zip ng song XML, o isang file ng awit.
source_desc_propresenter=Mga dokumento ng ProPresenter — bersyon 4 hanggang 7, isang awit bawat file.
source_desc_easyworship=Mga library at iskedyul ng EasyWorship — hinahati sa mga indibidwal na awit.
source_desc_mediashout=Mga script ng MediaShout 7 — kinukuha ang bawat awit na ipinapakita ng script.
source_desc_videopsalm=Mga songbook ng VideoPsalm — isang file ang naglalaman ng buong aklat, pati na ang mga ulit.
source_desc_documents=Kunin ang liriko mula sa mga PDF, PowerPoint at Word file.

