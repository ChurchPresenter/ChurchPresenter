# Source format descriptions
source_desc_songbeamer=Archivos de texto de SongBeamer: la importación más fiable.
source_desc_freeworship=Exportaciones de Free Worship: XML de OpenLyrics, un archivo por canción.
source_desc_softprojector=Cancioneros de SoftProjector: se dividen en canciones individuales.
source_desc_openlp=Bibliotecas de OpenLP: la propia base de datos songs.sqlite o una exportación de OpenLyrics.
source_desc_opensong=Archivos de canciones de OpenSong: XML con la letra en texto plano, normalmente sin extensión.
source_desc_freeshow=Shows de FreeShow: JSON, leídos en el orden en que los canta el diseño activo.
source_desc_easyslides=Exportaciones de EasySlides: un solo archivo XML contiene toda la base de canciones.
source_desc_quelea=Paquetes de canciones de Quelea: un zip con XML de canciones o un solo archivo.
source_desc_propresenter=Documentos de ProPresenter: versiones 4 a 7, una canción por archivo.
source_desc_easyworship=Bibliotecas y programas de EasyWorship: se dividen en canciones individuales.
source_desc_mediashout=Guiones de MediaShout 7: extrae todas las canciones que presenta el guion.
source_desc_videopsalm=Cancioneros de VideoPsalm: un archivo contiene el libro entero, repeticiones incluidas.
source_desc_documents=Extraer letras de archivos PDF, PowerPoint y Word.

