# Source format descriptions
source_desc_songbeamer=SongBeamer tekstualne datoteke — najpouzdaniji uvoz.
source_desc_freeworship=Izvozi iz Free Worshipa — OpenLyrics XML, jedna datoteka po pjesmi.
source_desc_softprojector=SoftProjector pjesmarice — dijele se na pojedinačne pjesme.
source_desc_openlp=OpenLP knjižnice — sama baza songs.sqlite ili OpenLyrics izvoz.
source_desc_opensong=OpenSong datoteke pjesama — XML s tekstom pjesme, obično bez nastavka.
source_desc_freeshow=FreeShow prezentacije — JSON, čitane redoslijedom kojim ih pjeva aktivni raspored.
source_desc_easyslides=EasySlides izvozi — jedna XML datoteka sadrži cijelu bazu pjesama.
source_desc_quelea=Quelea paketi pjesama — zip s XML-om pjesama ili jedna datoteka pjesme.
source_desc_propresenter=ProPresenter dokumenti — verzije 4 do 7, jedna pjesma po datoteci.
source_desc_easyworship=EasyWorship knjižnice i rasporedi — dijele se na pojedinačne pjesme.
source_desc_mediashout=MediaShout 7 skripte — izvlači svaku pjesmu koju skripta prikazuje.
source_desc_videopsalm=VideoPsalm pjesmarice — jedna datoteka sadrži cijelu knjigu, s ponavljanjima.
source_desc_documents=Izvuci tekstove pjesama iz PDF, PowerPoint i Word datoteka.

