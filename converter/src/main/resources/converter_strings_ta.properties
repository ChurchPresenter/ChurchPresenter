# Source format descriptions
source_desc_songbeamer=SongBeamer உரைக் கோப்புகள் — மிகவும் நம்பகமான இறக்குமதி.
source_desc_freeworship=Free Worship ஏற்றுமதிகள் — OpenLyrics XML, ஒரு பாடலுக்கு ஒரு கோப்பு.
source_desc_softprojector=SoftProjector பாடல் புத்தகங்கள் — தனித்தனி பாடல்களாகப் பிரிக்கப்படும்.
source_desc_openlp=OpenLP நூலகங்கள் — songs.sqlite தரவுத்தளமே, அல்லது OpenLyrics ஏற்றுமதி.
source_desc_opensong=OpenSong பாடல் கோப்புகள் — வரிகளை வெற்று உரையாகக் கொண்ட XML, பொதுவாக நீட்டிப்பு இல்லாமல்.
source_desc_freeshow=FreeShow காட்சிகள் — JSON, செயலில் உள்ள தளவமைப்பு பாடும் வரிசையில் படிக்கப்படும்.
source_desc_easyslides=EasySlides ஏற்றுமதிகள் — ஒரே XML கோப்பில் முழு பாடல் தரவுத்தளம்.
source_desc_quelea=Quelea பாடல் தொகுப்புகள் — பாடல் XML கொண்ட zip, அல்லது ஒற்றைப் பாடல் கோப்பு.
source_desc_propresenter=ProPresenter ஆவணங்கள் — பதிப்புகள் 4 முதல் 7 வரை, ஒரு கோப்பிற்கு ஒரு பாடல்.
source_desc_easyworship=EasyWorship நூலகங்களும் அட்டவணைகளும் — தனித்தனி பாடல்களாகப் பிரிக்கப்படும்.
source_desc_mediashout=MediaShout 7 ஸ்கிரிப்ட்கள் — ஸ்கிரிப்ட் காட்டும் ஒவ்வொரு பாடலையும் எடுக்கும்.
source_desc_videopsalm=VideoPsalm பாடல் புத்தகங்கள் — ஒரே கோப்பில் முழுப் புத்தகமும், மீண்டும் வரும் பகுதிகளுடன்.
source_desc_documents=PDF, PowerPoint மற்றும் Word கோப்புகளிலிருந்து பாடல் வரிகளை எடுக்கவும்.

# What each supported format accepts
source_accepts_songbeamer=.sng கோப்புகள், அல்லது முழு பாடல் கோப்புறை
source_accepts_freeworship=.xml பாடல் கோப்புகள், அல்லது அவற்றின் கோப்புறை
source_accepts_softprojector=ஒரே .sps பாடல் புத்தகம்
source_accepts_openlp=songs.sqlite, .xml ஏற்றுமதிகள், அல்லது அவற்றின் கோப்புறை
source_accepts_opensong=OpenSong பாடல் கோப்புகள், நீட்டிப்புடன் அல்லது இல்லாமல்
source_accepts_freeshow=.show கோப்புகள், அல்லது அவற்றின் கோப்புறை
source_accepts_easyslides=.xml ஏற்றுமதிகள், அல்லது அவற்றின் கோப்புறை
source_accepts_quelea=.qsp தொகுப்புகள் மற்றும் .xml பாடல் கோப்புகள்
source_accepts_propresenter=.pro, .pro4, .pro5 மற்றும் .pro6 கோப்புகள், அல்லது அவற்றின் கோப்புறை
source_accepts_easyworship=Songs.db கொண்ட நூலகக் கோப்புறை, அல்லது .ews மற்றும் .ewsx அட்டவணைகள்
source_accepts_mediashout=.sc7x மற்றும் .sc7 ஸ்கிரிப்ட் கோப்புகள்
source_accepts_videopsalm=VideoPsalm இன் SongBooks கோப்புறையிலிருந்து ஒரு .json பாடல் புத்தகம்
source_accepts_documents=.pdf, .pptx மற்றும் .docx கோப்புகள்

