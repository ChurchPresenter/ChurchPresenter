# Source format descriptions
source_desc_songbeamer=SongBeamer matn fayllari — eng ishonchli import.
source_desc_freeworship=Free Worship eksportlari — OpenLyrics XML, har qoʻshiqqa bitta fayl.
source_desc_softprojector=SoftProjector qoʻshiq kitoblari — alohida qoʻshiqlarga boʻlinadi.
source_desc_openlp=OpenLP kutubxonalari — songs.sqlite maʼlumotlar bazasining oʻzi yoki OpenLyrics eksporti.
source_desc_opensong=OpenSong qoʻshiq fayllari — matni oddiy matn koʻrinishidagi XML, odatda kengaytmasiz.
source_desc_freeshow=FreeShow koʻrsatuvlari — JSON, faol tartib ularni qanday kuylasa, shu tartibda oʻqiladi.
source_desc_easyslides=EasySlides eksportlari — bitta XML fayl butun qoʻshiqlar bazasini saqlaydi.
source_desc_quelea=Quelea qoʻshiq toʻplamlari — qoʻshiq XML fayllari boʻlgan zip yoki bitta qoʻshiq fayli.
source_desc_propresenter=ProPresenter hujjatlari — 4 dan 7 gacha versiyalar, har faylga bitta qoʻshiq.
source_desc_easyworship=EasyWorship kutubxonalari va rejalari — alohida qoʻshiqlarga boʻlinadi.
source_desc_mediashout=MediaShout 7 skriptlari — skript koʻrsatadigan har bir qoʻshiqni ajratib oladi.
source_desc_videopsalm=VideoPsalm qoʻshiq kitoblari — bitta fayl butun kitobni, takrorlari bilan saqlaydi.
source_desc_documents=PDF, PowerPoint va Word fayllaridan qoʻshiq matnlarini ajratib olish.

