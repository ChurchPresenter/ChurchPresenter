source_accepts_easyslides=.xml eksportlari yoki ular boʻlgan papka
source_accepts_quelea=.qsp toʻplamlari va .xml qoʻshiq fayllari
source_accepts_propresenter=.pro, .pro4, .pro5 va .pro6 fayllari yoki ular boʻlgan papka
