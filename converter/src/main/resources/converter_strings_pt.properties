# Source format descriptions
source_desc_songbeamer=Ficheiros de texto do SongBeamer — a importação mais fiável.
source_desc_freeworship=Exportações do Free Worship — XML OpenLyrics, um ficheiro por música.
source_desc_softprojector=Hinários do SoftProjector — divididos em músicas individuais.
source_desc_openlp=Bibliotecas do OpenLP — a própria base songs.sqlite ou uma exportação OpenLyrics.
source_desc_opensong=Ficheiros de música do OpenSong — XML com a letra em texto simples, normalmente sem extensão.
source_desc_freeshow=Shows do FreeShow — JSON, lidos na ordem em que o esquema ativo os canta.
source_desc_easyslides=Exportações do EasySlides — um ficheiro XML contém toda a base de músicas.
source_desc_quelea=Pacotes de músicas do Quelea — um zip com XML de músicas, ou um único ficheiro.
source_desc_propresenter=Documentos do ProPresenter — versões 4 a 7, uma música por ficheiro.
source_desc_easyworship=Bibliotecas e programações do EasyWorship — divididas em músicas individuais.
source_desc_mediashout=Scripts do MediaShout 7 — extrai todas as músicas que o script apresenta.
source_desc_videopsalm=Hinários do VideoPsalm — um ficheiro contém o hinário inteiro, repetições incluídas.
source_desc_documents=Extrair letras de ficheiros PDF, PowerPoint e Word.

