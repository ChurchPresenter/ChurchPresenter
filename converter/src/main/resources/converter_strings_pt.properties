source_accepts_easyworship=Uma pasta de biblioteca com Songs.db, ou programações .ews e .ewsx
source_accepts_mediashout=Ficheiros de script .sc7x e .sc7
source_accepts_videopsalm=Um hinário .json da pasta SongBooks do VideoPsalm
