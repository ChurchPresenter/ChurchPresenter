source_desc_quelea=بسته‌های سرود Quelea — یک zip از XML سرودها، یا یک فایل سرود.
source_desc_propresenter=سندهای ProPresenter — نسخه‌های ۴ تا ۷، هر فایل یک سرود.
source_desc_easyworship=کتابخانه‌ها و برنامه‌های EasyWorship — به سرودهای جداگانه تقسیم می‌شوند.
source_desc_mediashout=اسکریپت‌های MediaShout 7 — هر سرودی را که اسکریپت نمایش می‌دهد بیرون می‌کشد.
source_desc_videopsalm=کتاب‌های سرود VideoPsalm — یک فایل کل کتاب را همراه با تکرارها در خود دارد.
source_desc_documents=استخراج متن سرود از فایل‌های PDF، PowerPoint و Word.

