# Source format descriptions
source_desc_songbeamer=SongBeamer metin dosyaları — en güvenilir içe aktarma.
source_desc_freeworship=Free Worship dışa aktarımları — OpenLyrics XML, ilahi başına bir dosya.
source_desc_softprojector=SoftProjector ilahi kitapları — tek tek ilahilere bölünür.
source_desc_openlp=OpenLP kitaplıkları — songs.sqlite veritabanının kendisi ya da bir OpenLyrics dışa aktarımı.
source_desc_opensong=OpenSong ilahi dosyaları — sözleri düz metin olan XML, genellikle uzantısız.
source_desc_freeshow=FreeShow gösterileri — JSON, etkin düzenin söylediği sırayla okunur.
source_desc_easyslides=EasySlides dışa aktarımları — tek bir XML dosyası tüm ilahi veritabanını tutar.
source_desc_quelea=Quelea ilahi paketleri — ilahi XML'lerini içeren bir zip ya da tek bir ilahi dosyası.
source_desc_propresenter=ProPresenter belgeleri — 4 ile 7 arası sürümler, dosya başına bir ilahi.
source_desc_easyworship=EasyWorship kitaplıkları ve programları — tek tek ilahilere bölünür.
source_desc_mediashout=MediaShout 7 betikleri — betiğin gösterdiği her ilahiyi çıkarır.
source_desc_videopsalm=VideoPsalm ilahi kitapları — tek bir dosya, tekrarlarıyla birlikte tüm kitabı tutar.
source_desc_documents=PDF, PowerPoint ve Word dosyalarından ilahi sözlerini çıkarın.

