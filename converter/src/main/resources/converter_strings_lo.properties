# Source format descriptions
source_desc_songbeamer=ໄຟລ໌ຂໍ້ຄວາມ SongBeamer — ການນຳເຂົ້າທີ່ເຊື່ອຖືໄດ້ທີ່ສຸດ.
source_desc_freeworship=ໄຟລ໌ສົ່ງອອກຈາກ Free Worship — OpenLyrics XML, ໜຶ່ງໄຟລ໌ຕໍ່ໜຶ່ງບົດເພງ.
source_desc_softprojector=ປຶ້ມເພງ SoftProjector — ແຍກອອກເປັນບົດເພງແຕ່ລະບົດ.
source_desc_openlp=ຄັງ OpenLP — ຕົວຖານຂໍ້ມູນ songs.sqlite ເອງ, ຫຼືໄຟລ໌ສົ່ງອອກ OpenLyrics.
source_desc_opensong=ໄຟລ໌ບົດເພງ OpenSong — XML ທີ່ມີເນື້ອເພງເປັນຂໍ້ຄວາມທຳມະດາ, ສ່ວນຫຼາຍບໍ່ມີນາມສະກຸນ.
source_desc_freeshow=ການສະແດງ FreeShow — JSON, ອ່ານຕາມລຳດັບທີ່ຮູບແບບທີ່ໃຊ້ຢູ່ຮ້ອງ.
source_desc_easyslides=ໄຟລ໌ສົ່ງອອກ EasySlides — ໄຟລ໌ XML ດຽວມີຖານຂໍ້ມູນບົດເພງທັງໝົດ.
source_desc_quelea=ຊຸດບົດເພງ Quelea — ໄຟລ໌ zip ຂອງ XML ບົດເພງ, ຫຼືໄຟລ໌ບົດເພງດຽວ.
source_desc_propresenter=ເອກະສານ ProPresenter — ລຸ້ນ 4 ຫາ 7, ໜຶ່ງບົດເພງຕໍ່ໜຶ່ງໄຟລ໌.
source_desc_easyworship=ຄັງ ແລະ ຕາຕະລາງຂອງ EasyWorship — ແຍກອອກເປັນບົດເພງແຕ່ລະບົດ.
source_desc_mediashout=ສະຄຣິບ MediaShout 7 — ດຶງທຸກບົດເພງທີ່ສະຄຣິບສະແດງອອກມາ.
source_desc_videopsalm=ປຶ້ມເພງ VideoPsalm — ໄຟລ໌ດຽວມີປຶ້ມທັງຫົວ, ລວມທັງທ່ອນຊ້ຳນຳ.
source_desc_documents=ດຶງເນື້ອເພງຈາກໄຟລ໌ PDF, PowerPoint ແລະ Word.

