# Source format descriptions
source_desc_songbeamer=SongBeamer text files — the most reliable import.
source_desc_freeworship=Free Worship song exports — OpenLyrics XML, one file per song.
source_desc_softprojector=SoftProjector song books — splits into individual songs.
source_desc_openlp=OpenLP libraries — the songs.sqlite database itself, or an OpenLyrics export.
source_desc_opensong=OpenSong song files — XML with a plain-text lyrics body, usually with no extension.
source_desc_freeshow=FreeShow shows — JSON, read in the order the active layout sings them.
source_desc_easyslides=EasySlides exports — one XML file holds the whole song database.
source_desc_quelea=Quelea song packs — a zip of song XML, or a single song file.
source_desc_propresenter=ProPresenter documents — versions 4 to 7, one song per file.
source_desc_easyworship=EasyWorship libraries and schedules — splits into individual songs.
source_desc_mediashout=MediaShout 7 scripts — pulls out every song the script presents.
source_desc_videopsalm=VideoPsalm song books — one file holds the whole book, repeats and all.
source_desc_documents=Pull lyrics out of PDF, PowerPoint, Keynote and Word files.

# What each supported format accepts
source_accepts_songbeamer=.sng files, or a whole song folder
source_accepts_freeworship=.xml song files, or a folder of them
source_accepts_softprojector=A single .sps song book
source_accepts_openlp=songs.sqlite, or .xml exports, or a folder of them
source_accepts_opensong=OpenSong song files, with or without an extension
source_accepts_freeshow=.show files, or a folder of them
source_accepts_easyslides=.xml exports, or a folder of them
source_accepts_quelea=.qsp packs and .xml song files
source_accepts_propresenter=.pro, .pro4, .pro5 and .pro6 files, or a folder of them
source_accepts_easyworship=A Songs.db library folder, or .ews and .ewsx schedules
source_accepts_mediashout=.sc7x and .sc7 script files
source_accepts_videopsalm=A .json song book from the VideoPsalm SongBooks folder
source_accepts_documents=.pdf, .pptx, .ppt, .docx and .key files

