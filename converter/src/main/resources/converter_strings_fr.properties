# Source format descriptions
source_desc_songbeamer=Fichiers texte SongBeamer — l'import le plus fiable.
source_desc_freeworship=Exports de chants Free Worship — XML OpenLyrics, un fichier par chant.
source_desc_softprojector=Recueils SoftProjector — découpés en chants individuels.
source_desc_openlp=Bibliothèques OpenLP — la base songs.sqlite elle-même, ou un export OpenLyrics.
source_desc_opensong=Fichiers de chants OpenSong — XML avec les paroles en texte brut, souvent sans extension.
source_desc_freeshow=Shows FreeShow — JSON, lus dans l'ordre où la mise en page active les chante.
source_desc_easyslides=Exports EasySlides — un seul fichier XML contient toute la base de chants.
source_desc_quelea=Packs de chants Quelea — une archive de XML de chants, ou un seul fichier.
source_desc_propresenter=Documents ProPresenter — versions 4 à 7, un chant par fichier.
source_desc_easyworship=Bibliothèques et programmes EasyWorship — découpés en chants individuels.
source_desc_mediashout=Scripts MediaShout 7 — extrait chaque chant que le script présente.
source_desc_videopsalm=Recueils VideoPsalm — un fichier contient tout le recueil, reprises comprises.
source_desc_documents=Extraire les paroles de fichiers PDF, PowerPoint et Word.

# What each supported format accepts
source_accepts_songbeamer=Fichiers .sng, ou un dossier de chants entier
