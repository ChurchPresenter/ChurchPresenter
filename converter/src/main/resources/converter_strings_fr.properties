source_accepts_opensong=Fichiers de chants OpenSong, avec ou sans extension
source_accepts_freeshow=Fichiers .show, ou un dossier
source_accepts_easyslides=Exports .xml, ou un dossier
source_accepts_quelea=Packs .qsp et fichiers de chants .xml
source_accepts_propresenter=Fichiers .pro, .pro4, .pro5 et .pro6, ou un dossier
source_accepts_easyworship=Un dossier de bibliothèque avec Songs.db, ou des programmes .ews et .ewsx
source_accepts_mediashout=Fichiers de script .sc7x et .sc7
source_accepts_videopsalm=Un recueil .json du dossier SongBooks de VideoPsalm
source_accepts_documents=Fichiers .pdf, .pptx et .docx

