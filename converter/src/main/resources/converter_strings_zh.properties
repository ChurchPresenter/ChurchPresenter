# Source format descriptions
source_desc_songbeamer=SongBeamer 文本文件——最可靠的导入方式。
source_desc_freeworship=Free Worship 导出——OpenLyrics XML，每首诗歌一个文件。
source_desc_softprojector=SoftProjector 诗歌本——拆分为单首诗歌。
source_desc_openlp=OpenLP 曲库——songs.sqlite 数据库本身，或 OpenLyrics 导出。
source_desc_opensong=OpenSong 诗歌文件——歌词为纯文本的 XML，通常没有扩展名。
source_desc_freeshow=FreeShow 演示——JSON，按当前布局演唱的顺序读取。
source_desc_easyslides=EasySlides 导出——单个 XML 文件即包含整个诗歌库。
source_desc_quelea=Quelea 诗歌包——诗歌 XML 的压缩包，或单个诗歌文件。
source_desc_propresenter=ProPresenter 文档——版本 4 至 7，每个文件一首诗歌。
source_desc_easyworship=EasyWorship 曲库与流程——拆分为单首诗歌。
source_desc_mediashout=MediaShout 7 脚本——提取脚本中呈现的每一首诗歌。
source_desc_videopsalm=VideoPsalm 诗歌本——单个文件包含整本诗歌本，连重复段落一起。
source_desc_documents=从 PDF、PowerPoint 和 Word 文件中提取歌词。

# What each supported format accepts
source_accepts_songbeamer=.sng 文件，或整个诗歌文件夹
source_accepts_freeworship=.xml 诗歌文件，或包含它们的文件夹
source_accepts_softprojector=单个 .sps 诗歌本
source_accepts_openlp=songs.sqlite、.xml 导出，或包含它们的文件夹
source_accepts_opensong=OpenSong 诗歌文件，有无扩展名均可
source_accepts_freeshow=.show 文件，或包含它们的文件夹
source_accepts_easyslides=.xml 导出，或包含它们的文件夹
source_accepts_quelea=.qsp 诗歌包和 .xml 诗歌文件
source_accepts_propresenter=.pro、.pro4、.pro5 和 .pro6 文件，或包含它们的文件夹
source_accepts_easyworship=含 Songs.db 的曲库文件夹，或 .ews 与 .ewsx 流程
source_accepts_mediashout=.sc7x 和 .sc7 脚本文件
source_accepts_videopsalm=来自 VideoPsalm 的 SongBooks 文件夹的 .json 诗歌本
source_accepts_documents=.pdf、.pptx 和 .docx 文件

