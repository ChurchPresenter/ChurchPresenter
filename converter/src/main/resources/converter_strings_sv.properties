# Source format descriptions
source_desc_songbeamer=SongBeamer-textfiler — den mest tillförlitliga importen.
source_desc_freeworship=Free Worship-exporter — OpenLyrics-XML, en fil per sång.
source_desc_softprojector=SoftProjector-sångböcker — delas upp i enskilda sånger.
source_desc_openlp=OpenLP-bibliotek — själva databasen songs.sqlite, eller en OpenLyrics-export.
source_desc_opensong=OpenSong-sångfiler — XML med sångtexten som ren text, oftast utan filändelse.
source_desc_freeshow=FreeShow-shower — JSON, lästa i den ordning den aktiva layouten sjunger dem.
source_desc_easyslides=EasySlides-exporter — en enda XML-fil rymmer hela sångdatabasen.
source_desc_quelea=Quelea-sångpaket — ett zip-arkiv med sång-XML, eller en enskild sångfil.
source_desc_propresenter=ProPresenter-dokument — version 4 till 7, en sång per fil.
source_desc_easyworship=EasyWorship-bibliotek och -scheman — delas upp i enskilda sånger.
source_desc_mediashout=MediaShout 7-manus — plockar ut varje sång som manuset visar.
source_desc_videopsalm=VideoPsalm-sångböcker — en fil rymmer hela boken, upprepningar och allt.
source_desc_documents=Hämta sångtexter ur PDF-, PowerPoint- och Word-filer.

