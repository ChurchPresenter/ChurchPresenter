# Source format descriptions
source_desc_songbeamer=SongBeamer-tekstfiler — den mest pålitelige importen.
source_desc_freeworship=Free Worship-eksporter — OpenLyrics-XML, én fil per sang.
source_desc_softprojector=SoftProjector-sangbøker — deles opp i enkeltsanger.
source_desc_openlp=OpenLP-biblioteker — selve songs.sqlite-databasen, eller en OpenLyrics-eksport.
source_desc_opensong=OpenSong-sangfiler — XML med sangteksten som ren tekst, som regel uten filendelse.
source_desc_freeshow=FreeShow-show — JSON, lest i den rekkefølgen det aktive oppsettet synger dem.
source_desc_easyslides=EasySlides-eksporter — én XML-fil rommer hele sangdatabasen.
source_desc_quelea=Quelea-sangpakker — et zip-arkiv med sang-XML, eller én enkelt sangfil.
source_desc_propresenter=ProPresenter-dokumenter — versjon 4 til 7, én sang per fil.
source_desc_easyworship=EasyWorship-biblioteker og -planer — deles opp i enkeltsanger.
source_desc_mediashout=MediaShout 7-manus — henter ut hver sang manuset viser.
source_desc_videopsalm=VideoPsalm-sangbøker — én fil rommer hele boka, gjentakelser og alt.
source_desc_documents=Hent sangtekster ut av PDF-, PowerPoint- og Word-filer.

