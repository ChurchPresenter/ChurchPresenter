# Source format descriptions
source_desc_songbeamer=SongBeamer のテキストファイル — 最も確実な取り込み。
source_desc_freeworship=Free Worship の書き出し — OpenLyrics XML、1 曲 1 ファイル。
source_desc_softprojector=SoftProjector の歌集 — 曲ごとに分割されます。
source_desc_openlp=OpenLP のライブラリ — songs.sqlite データベース本体、または OpenLyrics の書き出し。
source_desc_opensong=OpenSong の曲ファイル — 歌詞をプレーンテキストで持つ XML。通常は拡張子なし。
source_desc_freeshow=FreeShow のショー — JSON。アクティブなレイアウトが歌う順で読み取ります。
source_desc_easyslides=EasySlides の書き出し — 1 つの XML ファイルに曲データベース全体が入っています。
source_desc_quelea=Quelea の曲パック — 曲 XML の zip、または単一の曲ファイル。
source_desc_propresenter=ProPresenter のドキュメント — バージョン 4 から 7、1 ファイル 1 曲。
source_desc_easyworship=EasyWorship のライブラリと進行表 — 曲ごとに分割されます。
source_desc_mediashout=MediaShout 7 のスクリプト — スクリプトが表示するすべての曲を取り出します。
source_desc_videopsalm=VideoPsalm の歌集 — 1 ファイルに繰り返しも含めた歌集全体が入っています。
source_desc_documents=PDF・PowerPoint・Word ファイルから歌詞を取り出します。

# What each supported format accepts
source_accepts_songbeamer=.sng ファイル、または曲フォルダー全体
source_accepts_freeworship=.xml の曲ファイル、またはそれらのフォルダー
source_accepts_softprojector=.sps の歌集 1 つ
source_accepts_openlp=songs.sqlite、.xml の書き出し、またはそれらのフォルダー
source_accepts_opensong=OpenSong の曲ファイル(拡張子の有無は問いません)
source_accepts_freeshow=.show ファイル、またはそれらのフォルダー
source_accepts_easyslides=.xml の書き出し、またはそれらのフォルダー
source_accepts_quelea=.qsp パックと .xml の曲ファイル
source_accepts_propresenter=.pro、.pro4、.pro5、.pro6 ファイル、またはそれらのフォルダー
source_accepts_easyworship=Songs.db を含むライブラリフォルダー、または .ews・.ewsx の進行表
source_accepts_mediashout=.sc7x および .sc7 のスクリプトファイル
source_accepts_videopsalm=VideoPsalm の SongBooks フォルダーにある .json の歌集
source_accepts_documents=.pdf、.pptx、.docx ファイル

