# Where the ffmpeg bundled with the app comes from, per platform.
#
# The app ships its own ffmpeg because it is the one external dependency of the three we may
# redistribute — this app is GPLv3 and ffmpeg is GPL, where NDI's licence forbids it and VLC is a
# separate application — and because on macOS a camera is only ever opened by the ffmpeg we spawn,
# so a machine without one never triggers the system's camera permission prompt at all (issue #464).
#
# Each target names an archive and the SHA-256 of that archive. `fetchBundledFfmpeg` downloads it,
# verifies the digest, pulls the single `ffmpeg` program out of it and writes that into
# composeApp/src/jvmMain/appResources/<os>/, which is what packaging and `run` both read.
#
# NEVER point one of these at a rolling URL. A "latest" asset changes under a fixed digest and the
# verification then fails on every machine at once, which is the failure mode this file exists to
# prevent. Pin a versioned release.
#
# An empty url is legal and means "this build ships no ffmpeg": the app then falls back to whatever
# is installed on the machine, exactly as it did before, and says so in Settings → Projection.
#
# archive: zip | tar   (tar covers .tar.xz / .tar.gz — extracted with the system tar)
# entry:   the path of the ffmpeg program inside the archive, or a bare name to search for

# ffmpeg 9.0, arm64. osxexperts.net does NOT publish versioned filenames — this URL is replaced in
# place when a new build lands, at which point the digest below stops matching and the fetch fails
# loudly rather than silently shipping something else. That is the intended behaviour; re-pin then.
macos-aarch64.url=https://www.osxexperts.net/ffmpeg9arm.zip
macos-aarch64.sha256=d0c06c5c68ce48af3143b262f7a9118a7c9f67de1e237fcc24ffb14df9c67af9
macos-aarch64.archive=zip
macos-aarch64.entry=ffmpeg

# ffmpeg 9.0.1, x86_64. evermeet.cx keeps every version at its own URL, so this pin is stable.
macos-x86_64.url=https://evermeet.cx/ffmpeg/ffmpeg-9.0.1.zip
macos-x86_64.sha256=8a8c9e549983409fe6604b9aa665648b7a5def9407fe814c39c8b2ea7f64a48f
macos-x86_64.archive=zip
macos-x86_64.entry=ffmpeg

# ffmpeg 9.0.1, GPL static build. BtbN's dated `autobuild-*` tags are immutable; its `latest` tag
# is not, and must never be used here.
windows-x86_64.url=https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-01-13-13/ffmpeg-n9.0.1-11-ge47273f4d9-win64-gpl-9.0.zip
windows-x86_64.sha256=38c54b3d96147533dc568c1cf0709550af50b8c182711ff16792c9a27af728d8
windows-x86_64.archive=zip
windows-x86_64.entry=ffmpeg.exe

# ffmpeg 9.0.1, GPL static build, from the same immutable BtbN tag as the Windows one.
linux-x86_64.url=https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-01-13-13/ffmpeg-n9.0.1-11-ge47273f4d9-linux64-gpl-9.0.tar.xz
linux-x86_64.sha256=6f180db3c615393bb7e4a1b25d4a63395f97c850ee93244bb5428b8b15080ddc
linux-x86_64.archive=tar
linux-x86_64.entry=ffmpeg
