# Where the OMT (Open Media Transport) libraries bundled with the app come from, per platform.
#
# The app ships libomt and libvmx because it may: both are MIT (see THIRD_PARTY_OMT.md), where NDI's
# licence forbids redistributing its runtime. So an OMT output or Canvas source works on a fresh
# install with nothing else to download.
#
# Each target names an archive, the SHA-256 of that archive, and the two library files inside it.
# `fetchBundledOmt` downloads the archive, verifies the digest, and writes both files into
# composeApp/src/jvmMain/appResources/<os>/omt/, which packaging and `run` both read. libomt finds
# libvmx beside it at run time, so the two must always land in the same directory.
#
# NEVER point one of these at a rolling URL, for the reason gradle/ffmpeg-builds.properties gives:
# a digest pinned against a moving asset fails on every machine at once. Pin a versioned release.
#
# An empty url is legal and means "this build ships no OMT": the Projection settings card then says
# the library was not found and offers a folder to point it at.
#
# archive: zip | tar   (tar covers .tar.xz / .tar.gz — extracted with the system tar)
# entries: the two library paths inside the archive, comma-separated
# license: the path of the MIT notice inside the archive, copied beside them as LICENSE.txt — the
#          licence requires it to travel with every copy
#
# Measured on 2026-09-28 against v1.0.0.19, the libraries alone:
#
#   macOS (universal)   17.9 MB libomt + 0.3 MB libvmx
#   Windows x64          7.0 MB libomt + 0.5 MB libvmx
#   Windows arm64        7.2 MB libomt + 0.1 MB libvmx
#   Linux x86_64         8.6 MB libomt + 0.2 MB libvmx   (built by omt-linux.yml)

# macOS: one universal (x86_64 + arm64) pair serves both. The publisher states macOS 15 or later on
# Apple Silicon as the supported configuration; the x86_64 slice is there and is used, but an Intel
# Mac is outside what they test.
macos-aarch64.url=https://github.com/openmediatransport/libomtnet/releases/download/v1.0.0.19/OpenMediaTransport.Binaries.Release.v1.0.0.19.zip
macos-aarch64.sha256=c62460174499dabe703e3e57372daf5f1dd95f890355d11e30052b9ed35bdac4
macos-aarch64.archive=zip
macos-aarch64.license=LICENSE.txt
macos-aarch64.entries=Libraries/MacOS/libomt.dylib,Libraries/MacOS/libvmx.dylib

macos-x86_64.url=https://github.com/openmediatransport/libomtnet/releases/download/v1.0.0.19/OpenMediaTransport.Binaries.Release.v1.0.0.19.zip
macos-x86_64.sha256=c62460174499dabe703e3e57372daf5f1dd95f890355d11e30052b9ed35bdac4
macos-x86_64.archive=zip
macos-x86_64.license=LICENSE.txt
macos-x86_64.entries=Libraries/MacOS/libomt.dylib,Libraries/MacOS/libvmx.dylib

windows-x86_64.url=https://github.com/openmediatransport/libomtnet/releases/download/v1.0.0.19/OpenMediaTransport.Binaries.Release.v1.0.0.19.zip
windows-x86_64.sha256=c62460174499dabe703e3e57372daf5f1dd95f890355d11e30052b9ed35bdac4
windows-x86_64.archive=zip
windows-x86_64.license=LICENSE.txt
windows-x86_64.entries=Libraries/Winx64/libomt.dll,Libraries/Winx64/libvmx.dll

windows-aarch64.url=https://github.com/openmediatransport/libomtnet/releases/download/v1.0.0.19/OpenMediaTransport.Binaries.Release.v1.0.0.19.zip
windows-aarch64.sha256=c62460174499dabe703e3e57372daf5f1dd95f890355d11e30052b9ed35bdac4
windows-aarch64.archive=zip
windows-aarch64.license=LICENSE.txt
windows-aarch64.entries=Libraries/Winarm64/libomt.dll,Libraries/Winarm64/libvmx.dll

# Linux: the publisher ships no binaries, so .github/workflows/omt-linux.yml builds libvmx and libomt
# from pinned commits and publishes them as a release of this repository (tag omt-libs-1.0.0.19,
# published 2026-09-29 by run 36522724855, which also passed the real-library loopback test). To move
# to a new OMT version: bump the commits in that workflow, run it with `publish` ticked, and pin what
# it prints here.
linux-x86_64.url=https://github.com/ChurchPresenter/ChurchPresenter/releases/download/omt-libs-1.0.0.19/omt-1.0.0.19-linux-x86_64.tar.gz
linux-x86_64.sha256=c66651fa3bfaf76ceb86ef5eb82d44487b9be07056eac27d24aaa3981bbad001
linux-x86_64.archive=tar
linux-x86_64.license=LICENSE.txt
linux-x86_64.entries=libomt.so,libvmx.so
