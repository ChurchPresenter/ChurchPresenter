# The JetBrains Runtime the app runs and ships on, on macOS.
#
# A stock OpenJDK (Temurin 21.0.10-21.0.13, Temurin 25.0.5) on macOS 26 never makes a window that
# was brought forward by a click Java's focused window, so after clicking into the app from another
# app no key arrives (issue #969). The JetBrains Runtime does not have the bug. Windows and Linux
# do not have it either and stay on any JDK 21.
#
# Each target names the plain `jbrsdk` archive (it carries the jmods jlink needs) and its SHA-256.
# NEVER the `jbrsdk_jcef` flavour: packaging bundles every module of the runtime, so its Chromium
# would ship beside the app's own and its `jcef` module would shadow the app's org.cef classes.
# `provisionMacJbr` downloads it, verifies the digest and unpacks it under Gradle's user home, where
# `clean` does not reach. Pin a versioned build, never a rolling URL.
