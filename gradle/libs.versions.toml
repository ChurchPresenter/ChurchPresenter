[versions]
cyclonedx = "3.5.1"
# Not a dependency of the app: the floor for the Jackson the CycloneDX plugin loads (see composeApp).
jackson-core = "2.22.4"
jna = "5.19.1"
javafx = "21.0.12"
vlcj = "4.8.3"
androidx-lifecycle = "2.11.0"
sentry = "8.61.0"
sentryPlugin = "6.24.0"
logback = "1.6.5"
composeHotReload = "1.2.0"
roborazzi = "1.76.0"
detekt = "1.23.8"
composeMultiplatform = "1.12.1"
junit = "4.13.2"
# The platform launcher + the vintage engine that runs the JUnit 4 suite unchanged. See the
# useJUnitPlatform() note in composeApp/build.gradle.kts.
junitPlatform = "6.1.3"
junitVintage = "6.1.3"
mockk = "1.14.11"
kotlin = "2.4.21"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
material3 = "1.12.0-alpha03"
compottie = "2.3.3"
compose = "1.5.0"
navigationComposeJvmstubs = "2.10.2"
sqliteJdbc = "3.53.4.0"
ktor = "3.6.0"
# 3.6.4 binds its socket to the computer's own address on macOS, which macOS refuses while its own
# mDNS service holds port 5353, so the signage advert never starts there. Held at 3.6.3 until a
# release fixes it (.github/dependabot.yml skips 3.6.4).
jmdns = "3.6.3"
bouncycastle = "1.86"
apache-poi = "5.5.1"
pdfbox = "2.0.37"
aircompressor = "2.0.3"
junitJupiter = "6.1.3"
filekit = "0.16.0"
dbus-java = "5.2.2"
twelvemonkeys-imageio = "3.15.3"
# Property tests (generated inputs, checked against an invariant) -- test scope only.
kotest = "6.2.6"
# Mutation testing: the Gradle plugin, the engine it runs, and the engine's JUnit Platform support.
pitestPlugin = "1.19.0"
pitest = "1.30.0"
pitestJunit5 = "1.2.3"

[libraries]
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson-core" }
# The embedded Chromium the Web tab and the output window browse with; its natives are per
# platform, in :composeApp.
jcefmaven = { module = "me.friwi:jcefmaven", version = "143.0.14" }
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
# What :detekt-rules is written against: the rule API, and the harness its tests lint code with.
detekt-api = { module = "io.gitlab.arturbosch.detekt:detekt-api", version.ref = "detekt" }
detekt-test = { module = "io.gitlab.arturbosch.detekt:detekt-test", version.ref = "detekt" }
# The JSON reader BibleEngineClient parses the engine's messages with -- and, through the root build's
# security floor, the one socket.io-client parses with too.
org-json = { module = "org.json:json", version = "20260814" }
# Security floors, not dependencies: what cp.base lifts each to when something older asks for it.
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version = "2.26.1" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version = "3.21.0" }
guava = { module = "com.google.guava:guava", version = "33.7.2" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }
vlcj = { module = "uk.co.caprica:vlcj", version.ref = "vlcj" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junitVintage" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-uiTest = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
compose-uiTestJunit4 = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version = "1.7.3" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-core-jvm = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
compottie = { module = "io.github.alexzhirkevich:compottie", version.ref = "compottie" }
compottie-dot = { module = "io.github.alexzhirkevich:compottie-dot", version.ref = "compottie" }
androidx-navigation-compose-jvmstubs = { group = "androidx.navigation", name = "navigation-compose-jvmstubs", version.ref = "navigationComposeJvmstubs" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
sentry = { module = "io.sentry:sentry", version.ref = "sentry" }
sentry-logback = { module = "io.sentry:sentry-logback", version.ref = "sentry" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
ktor-server-core = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty-jvm", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation-jvm", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors-jvm", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets-jvm", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json-jvm", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages-jvm", version.ref = "ktor" }
ktor-server-partial-content = { module = "io.ktor:ktor-server-partial-content-jvm", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core-jvm", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio-jvm", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets-jvm", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock-jvm", version.ref = "ktor" }
jmdns = { module = "org.jmdns:jmdns", version.ref = "jmdns" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
apache-poi = { module = "org.apache.poi:poi", version.ref = "apache-poi" }
apache-poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "apache-poi" }
apache-poi-ooxmlFull = { module = "org.apache.poi:poi-ooxml-full", version.ref = "apache-poi" }
apache-poi-scratchpad = { module = "org.apache.poi:poi-scratchpad", version.ref = "apache-poi" }
twelvemonkeys-imageio-core = { module = "com.twelvemonkeys.imageio:imageio-core", version.ref = "twelvemonkeys-imageio" }
twelvemonkeys-imageio-jpeg = { module = "com.twelvemonkeys.imageio:imageio-jpeg", version.ref = "twelvemonkeys-imageio" }
twelvemonkeys-imageio-psd = { module = "com.twelvemonkeys.imageio:imageio-psd", version.ref = "twelvemonkeys-imageio" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
aircompressor = { module = "io.airlift:aircompressor", version.ref = "aircompressor" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
zxing-core = { module = "com.google.zxing:core", version = "3.5.4" }
zxing-javase = { module = "com.google.zxing:javase", version = "3.5.4" }
socket-io-client = { module = "io.socket:socket.io-client", version = "2.1.2" }
# Not used directly: the floor for the okhttp socket.io-client brings (see the root build).
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "4.12.0" }
filekit-dialogs = { module = "io.github.vinceglb:filekit-dialogs", version.ref = "filekit" }
dbus-java-core = { module = "com.github.hypfvieh:dbus-java-core", version.ref = "dbus-java" }
dbus-java-transport-junixsocket = { module = "com.github.hypfvieh:dbus-java-transport-junixsocket", version.ref = "dbus-java" }
roborazzi-composeDesktop = { module = "io.github.takahirom.roborazzi:roborazzi-compose-desktop", version.ref = "roborazzi" }

[plugins]
composeHotReload = { id = "org.jetbrains.compose.hot-reload", version.ref = "composeHotReload" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sentry = { id = "io.sentry.jvm.gradle", version.ref = "sentryPlugin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitestPlugin" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
