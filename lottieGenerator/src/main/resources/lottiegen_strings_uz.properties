editor_register_done_body=Tayyor — uslub keyingi yigʻmada kodni tahrirlamasdan chiqadi. Ushbu ikki faylni commit qiling:\n%1$s\n%2$s\n\nIxtiyoriy: tanlagich yorligʻini mahalliylashtirish uchun lottiegen_strings.properties fayliga style_%3$s kalitini qoʻshing.
editor_tip_register=Spetsifikatsiya va uning reyestr yozuvini toʻgʻridan-toʻgʻri manba nusxasiga yozish — ikki faylni commit qilganingizdan soʻng keyingi yigʻmada chiqadi, kodni tahrirlash shart emas
editor_export_replaces=«%s» oʻrnini egallaydi — «Yigʻmaga roʻyxatdan oʻtkazish» almashtirishni reyestr orqali avtomatik bajaradi (kodni tahrirlamasdan).
editor_export_done_title=Spetsifikatsiya eksport qilindi
editor_export_done_steps=Qolgan roʻyxatdan oʻtkazish qadamlari (ADDING_ANIMATIONS.md ga qarang):\n1. src/main/resources/styles/ ostidagi faylni commit qiling\n2. LottieGenerator xaritasi: "%1$s" dan SpecStyleGenerator.fromResource("/styles/%2$s") ga\n3. Enums.kt: STYLE_%1$s("%1$s", "style_%1$s") + yorliq tarmogʻi STYLE_%1$s -> Strings.style%1$s\n4. Strings.kt: val style%1$s get() = bundle.getString("style_%1$s")\n5. lottiegen_strings.properties (faqat asosiy): style_%1$s=Style %1$s — %3$s
