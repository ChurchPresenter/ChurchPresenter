editor_export_done_title=ส่งออกสเปกแล้ว
editor_export_done_steps=ขั้นตอนการลงทะเบียนที่เหลือ (ดู ADDING_ANIMATIONS.md):\n1. คอมมิตไฟล์ใน src/main/resources/styles/\n2. แมป LottieGenerator: "%1$s" ไปยัง SpecStyleGenerator.fromResource("/styles/%2$s")\n3. Enums.kt: STYLE_%1$s("%1$s", "style_%1$s") + สาขาป้าย STYLE_%1$s -> Strings.style%1$s\n4. Strings.kt: val style%1$s get() = bundle.getString("style_%1$s")\n5. lottiegen_strings.properties (เฉพาะไฟล์หลัก): style_%1$s=Style %1$s — %3$s
