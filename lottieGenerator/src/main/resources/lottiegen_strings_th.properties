editor_register_done_body=เสร็จแล้ว — รูปแบบนี้จะมาพร้อมบิลด์ถัดไปโดยไม่ต้องแก้โค้ด คอมมิตไฟล์ทั้งสองนี้:\n%1$s\n%2$s\n\nไม่บังคับ: เพิ่มคีย์ style_%3$s ใน lottiegen_strings.properties เพื่อแปลป้ายในตัวเลือก
