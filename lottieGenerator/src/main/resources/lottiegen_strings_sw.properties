editor_export_done_steps=Hatua zilizobaki za usajili (tazama ADDING_ANIMATIONS.md):\n1. Fanya commit ya faili chini ya src/main/resources/styles/\n2. Ramani ya LottieGenerator: "%1$s" kwenda SpecStyleGenerator.fromResource("/styles/%2$s")\n3. Enums.kt: STYLE_%1$s("%1$s", "style_%1$s") + tawi la lebo STYLE_%1$s -> Strings.style%1$s\n4. Strings.kt: val style%1$s get() = bundle.getString("style_%1$s")\n5. lottiegen_strings.properties (msingi pekee): style_%1$s=Style %1$s — %3$s
