editor_export_replaces=E mono i te "%s" — e rave ʻōtomati te Tāpaʻo i roto i te build i te monoraʻa nā roto i te registry (ʻaita e tauiraʻa code).
editor_export_done_title=Ua hāponohia te spec
editor_export_done_steps=Te mau taʻahiraʻa tāpaʻoraʻa e toe ra (a hiʻo i te ADDING_ANIMATIONS.md):\n1. A commit i te fichier i raro aʻe i te src/main/resources/styles/\n2. LottieGenerator map: "%1$s" to SpecStyleGenerator.fromResource("/styles/%2$s")\n3. Enums.kt: STYLE_%1$s("%1$s", "style_%1$s") + label branch STYLE_%1$s -> Strings.style%1$s\n4. Strings.kt: val style%1$s get() = bundle.getString("style_%1$s")\n5. lottiegen_strings.properties (base anaʻe): style_%1$s=Style %1$s — %3$s
