editor_export_done_steps=Астатнія крокі рэгістрацыі (гл. ADDING_ANIMATIONS.md):\n1. Закаміцьце файл у src/main/resources/styles/\n2. Мапа LottieGenerator: "%1$s" да SpecStyleGenerator.fromResource("/styles/%2$s")\n3. Enums.kt: STYLE_%1$s("%1$s", "style_%1$s") + галіна подпісу STYLE_%1$s -> Strings.style%1$s\n4. Strings.kt: val style%1$s get() = bundle.getString("style_%1$s")\n5. lottiegen_strings.properties (толькі базавы): style_%1$s=Style %1$s — %3$s
