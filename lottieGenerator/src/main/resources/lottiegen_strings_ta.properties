editor_register_done_body=முடிந்தது — குறியீட்டுத் திருத்தம் இல்லாமல் அடுத்த கட்டமைப்பில் பாணி வெளியாகும். இந்த இரண்டு கோப்புகளையும் commit செய்யவும்:\n%1$s\n%2$s\n\nவிருப்பம்: தேர்வி லேபிளை உள்ளூர்மயமாக்க lottiegen_strings.properties இல் style_%3$s விசையைச் சேர்க்கவும்.
