editor_export_done_title=Spec ஏற்றுமதி செய்யப்பட்டது
editor_export_done_steps=மீதமுள்ள பதிவுப் படிகள் (ADDING_ANIMATIONS.md ஐப் பார்க்கவும்):\n1. src/main/resources/styles/ இல் உள்ள கோப்பை commit செய்யவும்\n2. LottieGenerator map: "%1$s" to SpecStyleGenerator.fromResource("/styles/%2$s")\n3. Enums.kt: STYLE_%1$s("%1$s", "style_%1$s") + label branch STYLE_%1$s -> Strings.style%1$s\n4. Strings.kt: val style%1$s get() = bundle.getString("style_%1$s")\n5. lottiegen_strings.properties (அடிப்படை மட்டும்): style_%1$s=Style %1$s — %3$s
