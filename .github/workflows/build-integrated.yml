name: Build Integrated App

on:
  push:
    branches:
      - 'builds/**'
      - 'codex/build-**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packages:
    uses: ./.github/workflows/build.yml
    with:
      windows: true
      macos_arm64: true
      macos_x64: true
      linux: false
      release: true
      prerelease: false
    secrets: inherit
