      # Puts the failure message and stack trace of every failed test in the pull request itself,
      # instead of leaving a reviewer to download the report artifact below and open it locally.
      # Also annotates the failing line in the Files-changed view.
      #
      # `!cancelled()` so it runs after a failed suite — that is the only time it has anything to
      # say — and `detailed_summary` so each failure is listed by name rather than as a count.
      #
      # It never fails the job on its own (`fail_on_failure: false`): the test step that produced
      # the XML has already done that, and a reporter that can also fail turns one red step into
      # two for the same cause.
      # Only the modules that ran: a module whose suite was skipped (nothing it depends on changed)
      # has no results on this runner, and listing it anyway put a "0 ran" row and an empty check in
      # every pull request. The paths and names are built here, together, so they cannot drift apart.
      - name: Which test results to report
        id: junit_inputs
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob
          MODULES = [
              ("composeApp", "App"),
              ("converter", "Converter"),
              ("companion-satellite", "Companion Satellite"),
              ("lottieGenerator", "Lower Third generator"),
              ("crossword", "Crossword"),
              ("presentation-engine", "Presentation Engine"),
              ("theme", "Theme"),
              ("core-models", "Core models"),
              ("songlibrary", "Song library"),
              ("bible-engine", "Bible Lookup Engine"),
              ("settings", "Settings"),
              ("diagnostics", "Diagnostics"),
              ("atem", "ATEM client"),
              ("ndi", "NDI client"),
              ("omt", "OMT client"),
              ("planning-center", "Planning Center"),
              ("bible-formats", "Bible formats"),
              ("song-chords", "Song chords"),
              ("bible", "Bible"),
              ("calendar", "Calendar"),
              ("shared-ui", "Shared UI"),
              ("slides", "Slides"),
              ("media", "Media"),
              ("web", "Web"),
              ("crossword-tab", "Crossword tab"),
              ("qa", "QA"),
              ("obs", "OBS"),
              ("dictionary", "Dictionary"),
              ("stt", "STT"),
              ("announcements", "Announcements"),
              ("lower-third", "Lower Third"),
              ("songs", "Songs"),
              ("bible-tab", "Bible tab"),
              ("server", "Server"),
              ("schedule", "Schedule"),
              ("canvas", "Canvas"),
              ("presenter", "Presenter"),
              ("companion-surface", "Companion Surface"),
          ]
          ran = [(d, n) for d, n in MODULES if glob.glob(f"{d}/build/test-results/**/TEST-*.xml", recursive=True)]
          print("paths<<EOF")
          print("\n".join(f"{d}/build/test-results/**/TEST-*.xml" for d, _ in ran))
          print("EOF")
          print("names<<EOF")
          print("\n".join(n for _, n in ran))
          print("EOF")
          PY

      - name: Report failing tests on the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.junit_inputs.outputs.paths != '' }}
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: ${{ steps.junit_inputs.outputs.paths }}
          check_name: ${{ steps.junit_inputs.outputs.names }}
          detailed_summary: true
          include_passed: false
          # Without this the second table is one row of "No test annotations available" per
          # check_name on every green run -- `include_passed: false` leaves it nothing to list when
          # nothing failed. Off, that table appears only when there is a failure to put in it.
          verbose_summary: false
          fail_on_failure: false
          comment: true
          updateComment: true

      # Every module, every counter, current value. madrapps/jacoco-report was here first and only
      # reported modules containing changed files -- one row, and a red mark on a module at 99%.
      # Never gates: the jacocoTestCoverageVerification steps above are the real floors.
      - name: Coverage table
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          ./gradlew coverageFloors -q > floors.csv || true
          python3 - <<'PY' > coverage.md
          import glob, os, xml.etree.ElementTree as ET

          COUNTERS = ["INSTRUCTION", "BRANCH", "LINE", "COMPLEXITY", "METHOD", "CLASS"]
          PATTERNS = [
              "*/build/reports/jacoco/*/*.xml",
          ]

          # The floor as the verification task itself has it, so the cap reported is the cap enforced.
          floors = {}
          if os.path.exists("floors.csv"):
              for line in open("floors.csv"):
                  parts = line.strip().split(",")
                  if len(parts) == 4 and parts[0] == "FLOOR":
                      floors.setdefault(parts[1], {})[parts[2]] = float(parts[3]) * 100

          # Each report's own totals. composeApp's report is built over exactly the classes its floor
          # is (coverableAppClasses() in composeApp/build.gradle.kts), so these are the gated numbers.
          def totals(root):
              """Covered/total per counter, from the report's own totals."""
              sums = {}
              for c in root.findall("counter"):
                  missed, covered = int(c.get("missed")), int(c.get("covered"))
                  sums[c.get("type")] = (missed, covered)
              return {t: 100 * k / (m + k) for t, (m, k) in sums.items() if m + k}

          # Only modules that actually produced a report in THIS run. The sub-builds are gated on
          # their own directories, so a run that skipped them simply has no section for them.
          found = {}
          for pattern in PATTERNS:
              for path in glob.glob(pattern):
                  module = os.path.basename(path.split("/build/reports/jacoco/")[0])
                  try:
                      root = ET.parse(path).getroot()
                  except ET.ParseError:
                      continue
                  ratios = totals(root)
                  if ratios:
                      found[module] = ratios

          def under(module, counter):
              floor = floors.get(module, {}).get(counter)
              if floor is None or module not in found or counter not in found[module]:
                  return None
              gap = floor - found[module][counter]
              return gap if gap > 0 else None

          breached = {
              module: [c for c in COUNTERS if under(module, c) is not None]
              for module in found
          }
          total_breached = sum(len(v) for v in breached.values())

          print("<!-- coverage-table -->")
          print("## Coverage")
          if not found:
              print()
              print("No JaCoCo reports were produced in this run.")
          elif total_breached:
              print()
              modules = ", ".join(f"`{m}`" for m in sorted(breached) if breached[m])
              print(f":warning: **{total_breached} counter(s) below floor** in {modules}.")
          for module in sorted(found, key=lambda m: (m != "composeApp", m)):
              ratios = found[module]
              print()
              print(f"### {module}" + (" :warning:" if breached.get(module) else ""))
              print()
              print("| Counter | Floor | Actual |")
              print("|---|---|---|")
              for counter in COUNTERS:
                  if counter not in ratios:
                      continue
                  floor = floors.get(module, {}).get(counter)
                  cap = "" if floor is None else f"{floor:.0f}%"
                  gap = under(module, counter)
                  mark = "" if gap is None else f" :warning: -{gap:.2f}pt"
                  print(f"| {counter.title()} | {cap} | {ratios[counter]:.2f}%{mark} |")
          if found:
              print()
              print("Modules whose tests did not run in this build are not listed. The floors are")
              print("enforced by the `jacocoTestCoverageVerification` steps, not by this table.")
          PY

          # Upsert: one comment per pull request, found by the marker on its first line.
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
                 --jq '.[] | select(.body | startswith("<!-- coverage-table -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/$id" -F body=@coverage.md >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@coverage.md >/dev/null
          fi
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"

