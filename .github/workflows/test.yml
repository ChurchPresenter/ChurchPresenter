name: Tests

# The three build workflows are all workflow_dispatch-only, so until this existed nothing ran
# automatically on a push or a pull request -- including the module test suites, which were
# green but unenforced. This runs the whole suite on every PR, and on main after a merge.
#
# `push` is main-only again, and that is deliberate. Widening it to every branch meant a PR commit
# matched BOTH events, and the two runs then had to be reconciled somehow -- neither way works here:
#
#   * let both run: two 15-minute runs of the same commit, for nothing;
#   * dedupe them with a shared concurrency group: whichever is cancelled still posts a check named
#     `test`, and `test` is the required context on main (strict). A cancelled required check is not
#     a passing one, so EVERY pull request sat at BLOCKED with a green run beside a cancelled one.
#     #106, #107 and #108 all hit this.
#
# What the widening was for -- commits pushed to a branch whose PR had already merged running
# nothing -- is real but much smaller, and it only happens by pushing to a merged PR's branch, which
# is a mistake worth catching with `gh pr view` rather than with a second CI run per commit.
#
# `merge_group` is what lets this branch use a merge queue, and it is not optional: GitHub runs the
# queue's checks against a temporary `gh-readonly-queue/...` branch, and a workflow that does not
# listen for that event never reports `test` -- which is the required context on main, so every
# queued merge would sit until it timed out. The queue cannot be enabled before this trigger exists.
#
# It does not repeat the duplicate-run problem the note above describes. That was one commit
# matching two events; a merge_group run is a different ref (`gh-readonly-queue/main/pr-...`) that no
# `push` or `pull_request` event ever names, so it neither duplicates nor cancels them -- the
# concurrency group below keys on `ref_name`, which is unique per queue entry.
#
# Change detection compares the queue branch with `merge_group.base_sha` -- main as it stood when the
# group formed -- which is exactly the set of files the queued pull requests changed.
on:
  push:
    branches: [main]
  # Draft pull requests run nothing; `ready_for_review` is what runs the checks once one is marked
  # ready. The first step of `test` decides, from the PR's live state -- see the note there.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  # The JUnit reporter near the end of this job writes the failing tests into the pull request as a
  # comment and as inline annotations. Checks for the annotations, pull-requests for the comment;
  # `contents` deliberately stays read-only.
  checks: write
  pull-requests: write
  # For a draft's run to cancel itself -- see the first step of `test`.
  actions: write

concurrency:
  # A newer push to the same branch makes an in-flight run redundant. With `push` back to main only,
  # a commit matches one event, so this no longer has two runs to reconcile -- it just keeps the
  # newest run per branch.
  #
  # Still keyed on the bare branch name rather than `ref`: the two events spell the same branch
  # differently (on push `ref` is `refs/heads/<branch>`, on pull_request `head_ref` is `<branch>`),
  # so anything that has to hold for both wants `ref_name`.
  group: tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite takes ~14 minutes. Without a timeout a test that hangs instead of failing holds
    # the runner until GitHub's 6-hour default kills it, so the deadline is the failure signal.
    timeout-minutes: 60
    steps:
      # A draft runs nothing -- and must not leave behind a `test` that counts as passing. A skipped
      # job does count: #634 was opened as a draft and marked ready five seconds later, the `opened`
      # run (still saying draft) was queued after the `ready_for_review` one, skipped `test`,
      # cancelled the real run as the newer member of the concurrency group, and auto-merge merged
      # it with no suite run at all. So a draft cancels its own run instead: a cancelled `test`
      # blocks the merge, and the only `test` that can pass is one that ran the suite.
      #
      # Asked of the API rather than read from the event, whose draft flag can be stale -- a late
      # `opened` sees the PR is ready by now and runs. `ready_for_review` is taken at its word.
      # Fails open: if the lookup or the cancel does not work, the suite runs.
      - name: Stop if the pull request is still a draft
        if: github.event_name == 'pull_request' && github.event.action != 'ready_for_review'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" = "true" ]; then
            gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || true
            # The cancel lands asynchronously; wait for it rather than let the next step start.
            sleep 120
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Which modules' suites this change can affect, read off the build's own dependency graph
      # (`./gradlew moduleGraph`): a module runs when a file in its directory changed or when a
      # module it depends on -- transitively, test fixtures included -- did. There is no list here to
      # keep in step with the build files; .github/ci/affected_modules.py says what it does and the few
      # files that run everything. :composeApp consumes almost every module and runs regardless.
      #
      # The base is the pull request's or merge group's base commit, or the commit before a push.
      # Only that one commit is fetched: `git diff` between two commits needs their trees, not the
      # history between them. With no base -- workflow_dispatch, a new branch's all-zero `before` --
      # or one that cannot be fetched, every suite runs.
      - name: Which modules changed
        id: modules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          ./gradlew -q moduleGraph > module-graph.txt
          if [ -n "$BASE_SHA" ] && ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            BASE_SHA=""
          fi
          python3 .github/ci/affected_modules.py --graph module-graph.txt --base "$BASE_SHA" >> "$GITHUB_OUTPUT"

      # Static analysis, ~5s, ahead of the 14-minute suite so a style regression fails fast.
      # Pre-existing findings are baselined per module -- config/detekt/baseline.xml for
      # :composeApp, and bible-engine/ and presentation-engine/ carry their own. Everything else
      # listed here has no baseline at all and has to be clean.
      #
      # NOT gated on which modules changed, deliberately. A module's detekt task costs seconds, and the gate is
      # worth nothing if a change that breaks it can skip it: the shared config/detekt/detekt.yml
      # governs every module at once, so "this PR didn't touch that folder" does not mean that
      # folder still passes.
      #
      - name: Detekt
        run: >-
          ./gradlew :composeApp:detekt :theme:detekt :core-models:detekt :converter:detekt
          :crossword:detekt :companion-satellite:detekt :songlibrary:detekt :settings:detekt
          :diagnostics:detekt :bible-formats:detekt :atem:detekt :ndi:detekt :omt:detekt :planning-center:detekt
          :bible-engine:detekt :presentation-engine:detekt :song-chords:detekt :bible:detekt
          :calendar:detekt :lottieGenerator:detekt :shared-ui:detekt :slides:detekt :media:detekt :web:detekt :crossword-tab:detekt :qa:detekt :dictionary:detekt :stt:detekt :announcements:detekt :lower-third:detekt :songs:detekt :bible-tab:detekt :server:detekt :schedule:detekt :canvas:detekt :presenter:detekt :companion-surface:detekt :obs:detekt

      - name: App unit tests
        id: unit_tests
        # Tighter than the job's own deadline so a hang here is attributed to this step and the
        # module suites below (`!cancelled()`) and the report upload still get to run.
        #
        # Runs land around 19 minutes (18m45s and 19m24s, measured 2026-08-21) -- they used to be
        # 11-14, and this comment said so long after it stopped being true, which is how a 20-minute
        # Gradle-side cap came to be proposed that would have failed both of those healthy runs.
        # Re-measure before quoting a band. Two other things now fire before this budget does:
        # jvmTest's own 30-minute task timeout, and HungTestReporter, which halts a fork whose
        # single test has outlived the threshold below and writes a thread dump into the results.
        #
        # That threshold is 150s HERE rather than the five-minute default, and it is the whole
        # point of this line: the suite has hung outright three times, each occurrence costing a
        # ~22-minute run that ends with NO failing assertion and NO diagnosis. At 150s the reporter
        # halts the fork with a full thread dump instead, and the dump travels in `test-reports`.
        #
        # 150s is measured, not guessed. In a full local run the slowest CLASS is 37.1s for all of
        # its tests together (InstanceLinkClientTest), so no single test -- which is what the
        # reporter times -- comes close; 150s leaves four times that class's entire runtime as
        # headroom for a slower runner. If a legitimate test ever trips this, the answer is to fix
        # the test, not to raise the number: AGENT.md budgets ~1s a test.
        timeout-minutes: 40
        #
        # Compiled first, then the Kotlin compile daemon is stopped before a single test forks. It is
        # idle for the rest of the step but holds ~3-4 GB per instance, and beside the Gradle daemon
        # and the test forks (each well past its 1 GB heap in native Skia memory) it took the 16 GB
        # runner to zero with swap full; GitHub then loses the runner and reports the step as
        # "cancelled", with no test failing and no report uploaded.
        run: |
          ./gradlew :composeApp:jvmTestClasses
          pkill -f KotlinCompileDaemon || true
          ./gradlew :composeApp:jvmTest -PhangThresholdMs=150000

      # So an outlier explains itself instead of needing a guess: the one killed run above was
      # attributed to the wrong fixture precisely because nothing recorded where the time went.
      - name: Slowest test classes
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import glob, re
          rows = []
          for path in glob.glob('composeApp/build/test-results/jvmTest/TEST-*.xml'):
              head = open(path, errors='replace').read(4000)
              m = re.search(r'<testsuite name="([^"]+)"[^>]*tests="(\d+)"[^>]*time="([\d.]+)"', head)
              if m:
                  rows.append((float(m.group(3)), int(m.group(2)), m.group(1)))
          rows.sort(reverse=True)
          print(f'{len(rows)} suites, {sum(r[0] for r in rows):.0f}s of test time')
          print(f'{"time":>9}  {"tests":>5}  class')
          for t, n, name in rows[:25]:
              print(f'{t:>8.1f}s  {n:>5}  {name}')
          PY

      # Prints the six JaCoCo counters into the log and onto the run's summary page, in the same
      # format `./gradlew :composeApp:check` shows locally (minus the file:// link to the HTML tree,
      # which does not survive the runner). Nothing else in CI reported a coverage number -- the
      # floor below only speaks up when it is breached, so a run could move coverage several points
      # in either direction and say nothing.
      #
      # `-x jvmTest -x jvmTestSerial` for the same reason it is on the floor step: jacocoTestReport
      # `dependsOn` BOTH of them, and after a FAILED suite that dependency is not up to date, so
      # without this the step would relaunch the suite inside its own budget. The report is built
      # from the exec data the step above already wrote.
      #
      # Excluding only `jvmTest` was not enough, and hid a whole missing suite. When Detekt fails,
      # `App unit tests` is skipped -- but this step still ran, and with the serial task NOT excluded
      # it quietly executed the thirteen serial classes on its own. That wrote a jvmTestSerial exec
      # file and jvmTestSerial XML, so both pull-request comments then described a run in which the
      # suite had never started: "App 159 ran, 159 passed" from the junit reporter, and composeApp at
      # 33% instruction in the coverage table. One looked like a small green suite and the other like
      # a coverage collapse; neither had happened.
      #
      # Advisory after a failure, like the floor: the exec data is then from a run that stopped
      # early, so the numbers are understated. Still worth printing -- it is the only place the
      # counters appear -- but they are not comparable with a green run's.
      #
      # The step-summary path is handed over as `-PstepSummary` rather than left to the build
      # script to read out of the environment. `System.getenv` in build logic reads the Gradle
      # DAEMON's environment, frozen when the daemon started -- here, during Detekt -- while
      # GITHUB_STEP_SUMMARY names a fresh file per step that the runner consumes at that step's
      # end. So the block landed in Detekt's already-read file and never appeared anywhere. A
      # property travels with this invocation, so it is the live path.
      #
      # This and the suite, coverage and report steps after it run on `!cancelled()`, not
      # `always()`. Both run after a failed suite, which is the point; `always()` also runs after
      # the RUN was cancelled -- by `cancel-in-progress` when the branch moves -- and then the suite
      # stopped partway, JaCoCo has no execution data, and the coverage table posts every
      # composeApp counter at 0% under a "below floor" warning (#598 got exactly that). A step that
      # hits its own `timeout-minutes` is failed, not cancelled, so a hang in the suite still
      # reaches the steps below.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: ./gradlew :composeApp:jacocoTestReport -x jvmTest -x jvmTestSerial "-PstepSummary=$GITHUB_STEP_SUMMARY"

      # The six-counter floors (85% on most, 79% branch, 75% complexity), off the execution data the
      # tests above just produced. Their denominator excludes the app-entry wiring that only runs
      # under a real display -- see jacocoTestCoverageVerification in composeApp/build.gradle.kts.
      # `!cancelled()` so a coverage regression is reported alongside test failures rather than
      # hidden behind them.
      #
      # `-x jvmTest -x jvmTestSerial` is load-bearing. The Gradle task `dependsOn` both, which is
      # right for a developer running it directly, but here the suite has already run in the step
      # above -- see the Coverage summary step for what excluding only half of it did. When it
      # PASSED that task is up to date and the dependency costs nothing -- which is why this looked
      # fine for as long as the suite was green. When it FAILED it is not up to date, so this step
      # started the whole 21-minute suite again inside a 10-minute budget: a guaranteed timeout.
      # Observed on run 31232339922 (main, 2026-08-08) -- jvmTest failed at 01:40:44, this step
      # relaunched it at 01:41:20, killed at 01:50:57. Every red run paid an extra ten minutes and
      # reported a second failure that said "Coverage floor timed out" and meant nothing.
      #
      # Advisory whenever the suite did not pass: the exec data is then from a run that did not
      # finish -- or, when Detekt failed and the suite step was SKIPPED, is not there at all -- so
      # the number is understated and a floor breach would be an artefact. The build is already red
      # for a better reason, and `outcome != 'success'` covers the skipped case as well as the failed
      # one. When the suite passed this gates exactly as before, in seconds.
      - name: Coverage floor
        if: ${{ !cancelled() }}
        continue-on-error: ${{ steps.unit_tests.outcome != 'success' }}
        timeout-minutes: 10
        run: ./gradlew :composeApp:jacocoTestCoverageVerification -x jvmTest -x jvmTestSerial

      - name: Converter tests
        if: ${{ !cancelled() && steps.modules.outputs.converter == 'true' }}
        run: ./gradlew :converter:test

      # The module's own six-counter floor, off the execution data the step above just wrote.
      # `-x test` for the same reason the app's floor step has it: the task `dependsOn` the suite,
      # which is right for a developer running it directly and would re-run it here.
      - name: Converter coverage floor
        if: ${{ !cancelled() && steps.modules.outputs.converter == 'true' }}
        run: ./gradlew :converter:jacocoTestCoverageVerification -x test

      # Same reasoning as the converter above: a module of this build, so a root-wrapper task rather
      # than a separate Gradle bootstrap, and ungated because :composeApp depends on it.
      - name: Companion Satellite tests
        if: ${{ !cancelled() && steps.modules.outputs.companionsatellite == 'true' }}
        run: ./gradlew :companion-satellite:test

      - name: Companion Satellite coverage floor
        if: ${{ !cancelled() && steps.modules.outputs.companionsatellite == 'true' }}
        run: ./gradlew :companion-satellite:jacocoTestCoverageVerification -x test

      # Same reasoning as the converter above: a module of this build, so a root-wrapper task
      # rather than a wrapper of its own.
      - name: Lower Third generator tests
        if: ${{ !cancelled() && steps.modules.outputs.lottiegenerator == 'true' }}
        run: ./gradlew :lottieGenerator:test

      - name: Lower Third generator coverage floor
        if: ${{ !cancelled() && steps.modules.outputs.lottiegenerator == 'true' }}
        run: ./gradlew :lottieGenerator:jacocoTestCoverageVerification -x test

      # Same again: a module of this build, and its data layer carries the six-counter floor while
      # the Compose UI package is excluded from it.
      - name: Crossword tests
        if: ${{ !cancelled() && steps.modules.outputs.crossword == 'true' }}
        run: ./gradlew :crossword:test

      - name: Crossword coverage floor
        if: ${{ !cancelled() && steps.modules.outputs.crossword == 'true' }}
        run: ./gradlew :crossword:jacocoTestCoverageVerification -x test

      # The last module to be promoted out of the mounted sub-builds. Its floors are its measured
      # coverage rather than the 85% default — see the comment in its build file.
      - name: Presentation Engine tests
        if: ${{ !cancelled() && steps.modules.outputs.presentationengine == 'true' }}
        run: ./gradlew :presentation-engine:test

      - name: Presentation Engine coverage floor
        if: ${{ !cancelled() && steps.modules.outputs.presentationengine == 'true' }}
        run: ./gradlew :presentation-engine:jacocoTestCoverageVerification -x test

      - name: Theme tests
        if: ${{ !cancelled() && steps.modules.outputs.theme == 'true' }}
        run: ./gradlew :theme:test

      - name: Theme coverage floor
        if: ${{ !cancelled() && steps.modules.outputs.theme == 'true' }}
        run: ./gradlew :theme:jacocoTestCoverageVerification -x test

      - name: Bible Lookup Engine tests
        if: ${{ !cancelled() && steps.modules.outputs.bibleengine == 'true' }}
        run: ./gradlew :bible-engine:test

      - name: Bible Lookup Engine coverage floor
        if: ${{ !cancelled() && steps.modules.outputs.bibleengine == 'true' }}
        run: ./gradlew :bible-engine:jacocoTestCoverageVerification -x test

      - name: Core models tests
        if: ${{ !cancelled() && steps.modules.outputs.coremodels == 'true' }}
        run: ./gradlew :core-models:test

      - name: Core models coverage floor
        if: ${{ !cancelled() && steps.modules.outputs.coremodels == 'true' }}
        run: ./gradlew :core-models:jacocoTestCoverageVerification -x test

      - name: Song library tests
        if: ${{ !cancelled() && steps.modules.outputs.songlibrary == 'true' }}
        run: ./gradlew :songlibrary:test

      - name: Song library coverage floor
        if: ${{ !cancelled() && steps.modules.outputs.songlibrary == 'true' }}
        run: ./gradlew :songlibrary:jacocoTestCoverageVerification -x test

      - name: Settings tests
        if: ${{ !cancelled() && steps.modules.outputs.settings == 'true' }}
        run: ./gradlew :settings:test

      - name: Settings coverage floor
        if: ${{ !cancelled() && steps.modules.outputs.settings == 'true' }}
        run: ./gradlew :settings:jacocoTestCoverageVerification -x test

      - name: Diagnostics tests
        if: ${{ !cancelled() && steps.modules.outputs.diagnostics == 'true' }}
        run: ./gradlew :diagnostics:test

      - name: Diagnostics coverage floor
        if: ${{ !cancelled() && steps.modules.outputs.diagnostics == 'true' }}
        run: ./gradlew :diagnostics:jacocoTestCoverageVerification -x test

      # The ATEM protocol client. Its suite is loopback UDP against FakeAtemSwitcher -- no
      # hardware, no display -- so it runs here like any other module. Its BRANCH/COMPLEXITY floors
      # are below the 85% default for the reason given in its build file.
      - name: ATEM client tests
        if: ${{ !cancelled() && steps.modules.outputs.atem == 'true' }}
        run: ./gradlew :atem:test

      - name: ATEM client coverage floor
        if: ${{ !cancelled() && steps.modules.outputs.atem == 'true' }}
        run: ./gradlew :atem:jacocoTestCoverageVerification -x test

      # The NDI send client. Its suite drives the whole module -- the JNA marshalling included --
      # through a plain Kotlin fake, so it needs no NDI Runtime and no network, and it meets the
      # default 85% floor on all six counters with no override.
      - name: NDI client tests
        if: ${{ !cancelled() && steps.modules.outputs.ndi == 'true' }}
        run: ./gradlew :ndi:test

      - name: NDI client coverage floor
        if: ${{ !cancelled() && steps.modules.outputs.ndi == 'true' }}
        run: ./gradlew :ndi:jacocoTestCoverageVerification -x test

      # The OMT client, both directions, driven through a plain Kotlin fake like NDI's: no libomt,
      # no network. The real-library round trip is omt-linux.yml's, on the binaries it builds.
      - name: OMT client tests
        if: ${{ !cancelled() && steps.modules.outputs.omt == 'true' }}
        run: ./gradlew :omt:test

      - name: OMT client coverage floor
        if: ${{ !cancelled() && steps.modules.outputs.omt == 'true' }}
        run: ./gradlew :omt:jacocoTestCoverageVerification -x test

      - name: Planning Center tests
        if: ${{ !cancelled() && steps.modules.outputs.planningcenter == 'true' }}
        run: ./gradlew :planning-center:test

      - name: Planning Center coverage floor
        if: ${{ !cancelled() && steps.modules.outputs.planningcenter == 'true' }}
        run: ./gradlew :planning-center:jacocoTestCoverageVerification -x test

      - name: Bible formats tests
        if: ${{ !cancelled() && steps.modules.outputs.bibleformats == 'true' }}
        run: ./gradlew :bible-formats:test

      - name: Bible formats coverage floor
        if: ${{ !cancelled() && steps.modules.outputs.bibleformats == 'true' }}
        run: ./gradlew :bible-formats:jacocoTestCoverageVerification -x test

      - name: Song chords tests
        if: ${{ !cancelled() && steps.modules.outputs.songchords == 'true' }}
        run: ./gradlew :song-chords:test

      - name: Song chords coverage floor
        if: ${{ !cancelled() && steps.modules.outputs.songchords == 'true' }}
        run: ./gradlew :song-chords:jacocoTestCoverageVerification -x test

      - name: Bible tests
        if: ${{ !cancelled() && steps.modules.outputs.bible == 'true' }}
        run: ./gradlew :bible:test

      - name: Bible coverage floor
        if: ${{ !cancelled() && steps.modules.outputs.bible == 'true' }}
        run: ./gradlew :bible:jacocoTestCoverageVerification -x test

      - name: Calendar tests
        if: ${{ !cancelled() && steps.modules.outputs.calendar == 'true' }}
        run: ./gradlew :calendar:test

      - name: Calendar coverage floor
        if: ${{ !cancelled() && steps.modules.outputs.calendar == 'true' }}
        run: ./gradlew :calendar:jacocoTestCoverageVerification -x test

      - name: Shared UI tests
        if: ${{ !cancelled() && steps.modules.outputs.sharedui == 'true' }}
        run: ./gradlew :shared-ui:test

      - name: Shared UI coverage floor
        if: ${{ !cancelled() && steps.modules.outputs.sharedui == 'true' }}
        run: ./gradlew :shared-ui:jacocoTestCoverageVerification -x test

      - name: Slides tests
        if: ${{ !cancelled() && steps.modules.outputs.slides == 'true' }}
        run: ./gradlew :slides:test

      - name: Slides coverage floor
        if: ${{ !cancelled() && steps.modules.outputs.slides == 'true' }}
        run: ./gradlew :slides:jacocoTestCoverageVerification -x test

      - name: Media tests
        if: ${{ !cancelled() && steps.modules.outputs.media == 'true' }}
        run: ./gradlew :media:test

      - name: Media coverage floor
        if: ${{ !cancelled() && steps.modules.outputs.media == 'true' }}
        run: ./gradlew :media:jacocoTestCoverageVerification -x test

      - name: Web tests
        if: ${{ !cancelled() && steps.modules.outputs.web == 'true' }}
        run: ./gradlew :web:test

      - name: Web coverage floor
        if: ${{ !cancelled() && steps.modules.outputs.web == 'true' }}
        run: ./gradlew :web:jacocoTestCoverageVerification -x test

      - name: Crossword tab tests
        if: ${{ !cancelled() && steps.modules.outputs.crosswordtab == 'true' }}
        run: ./gradlew :crossword-tab:test

      - name: Crossword tab coverage floor
        if: ${{ !cancelled() && steps.modules.outputs.crosswordtab == 'true' }}
        run: ./gradlew :crossword-tab:jacocoTestCoverageVerification -x test

      - name: QA tests
        if: ${{ !cancelled() && steps.modules.outputs.qa == 'true' }}
        run: ./gradlew :qa:test

      - name: QA coverage floor
        if: ${{ !cancelled() && steps.modules.outputs.qa == 'true' }}
        run: ./gradlew :qa:jacocoTestCoverageVerification -x test

      - name: OBS tests
        if: ${{ !cancelled() && steps.modules.outputs.obs == 'true' }}
        run: ./gradlew :obs:test

      - name: OBS coverage floor
        if: ${{ !cancelled() && steps.modules.outputs.obs == 'true' }}
        run: ./gradlew :obs:jacocoTestCoverageVerification -x test

      - name: Dictionary tests
        if: ${{ !cancelled() && steps.modules.outputs.dictionary == 'true' }}
        run: ./gradlew :dictionary:test

      - name: Dictionary coverage floor
        if: ${{ !cancelled() && steps.modules.outputs.dictionary == 'true' }}
        run: ./gradlew :dictionary:jacocoTestCoverageVerification -x test

      - name: STT tests
        if: ${{ !cancelled() && steps.modules.outputs.stt == 'true' }}
        run: ./gradlew :stt:test

      - name: STT coverage floor
