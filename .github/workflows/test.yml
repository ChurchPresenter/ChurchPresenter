name: Tests

# The three build workflows are all workflow_dispatch-only, so until this existed nothing ran
# automatically on a push or a pull request -- including the module test suites, which were
# green but unenforced. This runs the whole suite on every PR, and on main after a merge.
#
# `push` is main-only again, and that is deliberate. Widening it to every branch meant a PR commit
# matched BOTH events, and the two runs then had to be reconciled somehow -- neither way works here:
#
#   * let both run: two 15-minute runs of the same commit, for nothing;
#   * dedupe them with a shared concurrency group: whichever is cancelled still posts a check named
#     `test`, and `test` is the required context on main (strict). A cancelled required check is not
#     a passing one, so EVERY pull request sat at BLOCKED with a green run beside a cancelled one.
#     #106, #107 and #108 all hit this.
#
# What the widening was for -- commits pushed to a branch whose PR had already merged running
# nothing -- is real but much smaller, and it only happens by pushing to a merged PR's branch, which
# is a mistake worth catching with `gh pr view` rather than with a second CI run per commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  # The JUnit reporter near the end of this job writes the failing tests into the pull request as a
  # comment and as inline annotations. Checks for the annotations, pull-requests for the comment;
  # `contents` deliberately stays read-only.
  checks: write
  pull-requests: write

concurrency:
  # A newer push to the same branch makes an in-flight run redundant. With `push` back to main only,
  # a commit matches one event, so this no longer has two runs to reconcile -- it just keeps the
  # newest run per branch.
  #
  # Still keyed on the bare branch name rather than `ref`: the two events spell the same branch
  # differently (on push `ref` is `refs/heads/<branch>`, on pull_request `head_ref` is `<branch>`),
  # so anything that has to hold for both wants `ref_name`.
  group: tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite takes ~14 minutes. Without a timeout a test that hangs instead of failing holds
    # the runner until GitHub's 6-hour default kills it, so the deadline is the failure signal.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Which sub-builds a change actually touched. Each is its own Gradle build with its own
      # wrapper, so a pull request that only edits app code has no reason to run five other suites --
      # that was ~2 minutes of every run spent proving that untouched code still compiles.
      #
      # This only became possible when the sub-builds stopped being git submodules. A submodule bump
      # is a one-line pointer change in the parent repo, so the module's real file paths never
      # appeared in the diff and nothing could be filtered on them.
      - name: Which sub-builds changed
        id: modules
        uses: dorny/paths-filter@v3
        with:
          filters: |
            # A module's own directory is NOT enough to decide it is untouched. These files
            # configure every module -- the version catalogue it resolves from, the root build that
            # owns its JaCoCo floors, the detekt rules it is judged by -- so a change to any of them
            # has to run everything. Without this, a catalog bump silently skips the module it broke.
            shared: &shared
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/libs.versions.toml'
              - 'gradle/wrapper/**'
              - 'config/detekt/**'
              - '.github/workflows/test.yml'
            engine:
              - 'composeApp/src/jvmMain/appResources/common/ChurchPresenter-PresentationEngine/**'
            ble:
              - 'composeApp/src/jvmMain/appResources/common/ChurchPresenter-BLE/**'
            lottiegen:
              - 'composeApp/src/jvmMain/appResources/common/ChurchPresenter-LottieGen/**'
            cross:
              - 'composeApp/src/jvmMain/appResources/common/ChurchPresenter-Cross/**'
            converter:
              - *shared
              - 'converter/**'
            satellite:
              - *shared
              - 'companion-satellite/**'
            theme:
              - *shared
              - 'theme/**'
            coremodels:
              - *shared
              - 'core-models/**'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Static analysis, ~5s, ahead of the 14-minute suite so a style regression fails fast.
      # Pre-existing findings are in config/detekt/baseline.xml; this gates only new ones.
      - name: Detekt
        run: ./gradlew :composeApp:detekt :theme:detekt :core-models:detekt

      - name: App unit tests
        id: unit_tests
        # Tighter than the job's own deadline so a hang here is attributed to this step and the
        # module suites below (`if: always()`) and the report upload still get to run. Runs land
        # around 11-14 minutes; one run was killed at a 25-minute budget with no diagnosis that
        # survived scrutiny, so the budget is set well clear of the observed band rather than
        # doubling as an alarm on a suite that is still growing.
        timeout-minutes: 40
        run: ./gradlew :composeApp:jvmTest

      # So an outlier explains itself instead of needing a guess: the one killed run above was
      # attributed to the wrong fixture precisely because nothing recorded where the time went.
      - name: Slowest test classes
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re
          rows = []
          for path in glob.glob('composeApp/build/test-results/jvmTest/TEST-*.xml'):
              head = open(path, errors='replace').read(4000)
              m = re.search(r'<testsuite name="([^"]+)"[^>]*tests="(\d+)"[^>]*time="([\d.]+)"', head)
              if m:
                  rows.append((float(m.group(3)), int(m.group(2)), m.group(1)))
          rows.sort(reverse=True)
          print(f'{len(rows)} suites, {sum(r[0] for r in rows):.0f}s of test time')
          print(f'{"time":>9}  {"tests":>5}  class')
          for t, n, name in rows[:25]:
              print(f'{t:>8.1f}s  {n:>5}  {name}')
          PY

      # Prints the six JaCoCo counters into the log and onto the run's summary page, in the same
      # format `./gradlew :composeApp:check` shows locally (minus the file:// link to the HTML tree,
      # which does not survive the runner). Nothing else in CI reported a coverage number -- the
      # floor below only speaks up when it is breached, so a run could move coverage several points
      # in either direction and say nothing.
      #
      # `-x jvmTest -x jvmTestSerial` for the same reason it is on the floor step: jacocoTestReport
      # `dependsOn` BOTH of them, and after a FAILED suite that dependency is not up to date, so
      # without this the step would relaunch the suite inside its own budget. The report is built
      # from the exec data the step above already wrote.
      #
      # Excluding only `jvmTest` was not enough, and hid a whole missing suite. When Detekt fails,
      # `App unit tests` is skipped -- but this step still ran, and with the serial task NOT excluded
      # it quietly executed the thirteen serial classes on its own. That wrote a jvmTestSerial exec
      # file and jvmTestSerial XML, so both PR comments then reported a run in which the suite had
      # never started: "App 159 ran, 159 passed" from the junit reporter, and composeApp at 33%
      # instruction in the coverage table. Both looked like a green partial run and a coverage
      # collapse; neither had happened.
      #
      # Advisory after a failure, like the floor: the exec data is then from a run that stopped
      # early, so the numbers are understated. Still worth printing -- it is the only place the
      # counters appear -- but they are not comparable with a green run's.
      #
      # The step-summary path is handed over as `-PstepSummary` rather than left to the build
      # script to read out of the environment. `System.getenv` in build logic reads the Gradle
      # DAEMON's environment, frozen when the daemon started -- here, during Detekt -- while
      # GITHUB_STEP_SUMMARY names a fresh file per step that the runner consumes at that step's
      # end. So the block landed in Detekt's already-read file and never appeared anywhere. A
      # property travels with this invocation, so it is the live path.
      - name: Coverage summary
        if: always()
        timeout-minutes: 10
        run: ./gradlew :composeApp:jacocoTestReport -x jvmTest -x jvmTestSerial "-PstepSummary=$GITHUB_STEP_SUMMARY"

      # The 75% line-coverage floor, off the execution data the tests above just produced. Its
      # denominator excludes the app-entry wiring that only runs under a real display -- see
      # jacocoTestCoverageVerification in composeApp/build.gradle.kts. `if: always()` so a coverage
      # regression is reported alongside test failures rather than hidden behind them.
      #
      # `-x jvmTest -x jvmTestSerial` is load-bearing. The Gradle task `dependsOn` both, which is
      # right for a developer running it directly, but here the suite has already run in the step
      # above -- see the Coverage summary step for what excluding only half of it did. When it
      # PASSED that task is up to date and the dependency costs nothing -- which is why this looked
      # fine for as long as the suite was green. When it FAILED it is not up to date, so this step
      # started the whole 21-minute suite again inside a 10-minute budget: a guaranteed timeout.
      # Observed on run 31232339922 (main, 2026-08-08) -- jvmTest failed at 01:40:44, this step
      # relaunched it at 01:41:20, killed at 01:50:57. Every red run paid an extra ten minutes and
      # reported a second failure that said "Coverage floor timed out" and meant nothing.
      #
      # Advisory whenever the suite did not pass: the exec data is then from a run that did not
      # finish -- or, when Detekt failed and the suite step was SKIPPED, is not there at all -- so
      # the number is understated and a floor breach would be an artefact. The build is already red
      # for a better reason, and `outcome != 'success'` covers the skipped case as well as the
      # failed one. When the suite passed this gates exactly as before, in seconds.
      - name: Coverage floor
        if: always()
        continue-on-error: ${{ steps.unit_tests.outcome != 'success' }}
        timeout-minutes: 10
        run: ./gradlew :composeApp:jacocoTestCoverageVerification -x jvmTest -x jvmTestSerial

      # The converter is a module of THIS build (`include(":converter")`), not one of the separate
      # builds below, so it is a task on the root wrapper and shares its daemon -- seconds rather
      # than a fresh Gradle bootstrap. That is why it is not gated on `steps.modules` the way they
      # are: there is nothing to save, and :composeApp depends on it, so an app change can break it.
      - name: Converter tests
        if: always() && steps.modules.outputs.converter == 'true'
        run: ./gradlew :converter:test

      # The module's own six-counter floor, off the execution data the step above just wrote.
      # `-x test` for the same reason the app's floor step has it: the task `dependsOn` the suite,
      # which is right for a developer running it directly and would re-run it here.
      - name: Converter coverage floor
        if: always() && steps.modules.outputs.converter == 'true'
        run: ./gradlew :converter:jacocoTestCoverageVerification -x test

      # Same reasoning as the converter above: a module of this build, so a root-wrapper task rather
      # than a separate Gradle bootstrap, and ungated because :composeApp depends on it.
      - name: Companion Satellite tests
        if: always() && steps.modules.outputs.satellite == 'true'
        run: ./gradlew :companion-satellite:test

      - name: Theme tests
        if: always() && steps.modules.outputs.theme == 'true'
        run: ./gradlew :theme:test

      - name: Theme coverage floor
        if: always() && steps.modules.outputs.theme == 'true'
        run: ./gradlew :theme:jacocoTestCoverageVerification -x test

      - name: Core models tests
        if: always() && steps.modules.outputs.coremodels == 'true'
        run: ./gradlew :core-models:test

      - name: Core models coverage floor
        if: always() && steps.modules.outputs.coremodels == 'true'
        run: ./gradlew :core-models:jacocoTestCoverageVerification -x test

      # Each module is its own Gradle build with its own wrapper, so they cannot be reached
      # from the root build and are invoked individually. `if: always()` keeps a failure in one
      # suite from hiding the results of the others; the `steps.modules` half skips a module whose
      # own directory this change did not touch.
      - name: Presentation Engine tests
        if: always() && steps.modules.outputs.engine == 'true'
        working-directory: composeApp/src/jvmMain/appResources/common/ChurchPresenter-PresentationEngine
        run: chmod +x gradlew && ./gradlew test

      - name: Bible Lookup Engine tests
        if: always() && steps.modules.outputs.ble == 'true'
        working-directory: composeApp/src/jvmMain/appResources/common/ChurchPresenter-BLE
        run: chmod +x gradlew && ./gradlew test

      - name: LottieGen tests
        if: always() && steps.modules.outputs.lottiegen == 'true'
        working-directory: composeApp/src/jvmMain/appResources/common/ChurchPresenter-LottieGen
        run: chmod +x gradlew && ./gradlew test


      # Kotlin Multiplatform, so the JVM suite is `jvmTest` rather than `test`.
      - name: Crossword tests
        if: always() && steps.modules.outputs.cross == 'true'
        working-directory: composeApp/src/jvmMain/appResources/common/ChurchPresenter-Cross
        run: chmod +x gradlew && ./gradlew jvmTest

      # Puts the failure message and stack trace of every failed test in the pull request itself,
      # instead of leaving a reviewer to download the report artifact below and open it locally.
      # Also annotates the failing line in the Files-changed view.
      #
      # `if: always()` so it runs after a failed suite — that is the only time it has anything to
      # say — and `detailed_summary` so each failure is listed by name rather than as a count.
      #
      # It never fails the job on its own (`fail_on_failure: false`): the test step that produced
      # the XML has already done that, and a reporter that can also fail turns one red step into
      # two for the same cause.
      - name: Report failing tests on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: |
            composeApp/build/test-results/**/TEST-*.xml
            converter/build/test-results/**/TEST-*.xml
            companion-satellite/build/test-results/**/TEST-*.xml
            theme/build/test-results/**/TEST-*.xml
            core-models/build/test-results/**/TEST-*.xml
            composeApp/src/jvmMain/appResources/common/*/build/test-results/**/TEST-*.xml
          # Paired with report_paths BY INDEX -- keep the two lists in the same order.
          check_name: |
            App
            Converter
            Companion Satellite
            Theme
            Core models
            Sub-builds (skipped unless their own directory changed)
          detailed_summary: true
          include_passed: false
          # Without this the second table is six rows of "No test annotations available" on every
          # green run -- one per check_name, because `include_passed: false` leaves it nothing to
          # list when nothing failed. Off, the table appears only when there is a failure in it.
          verbose_summary: false
          fail_on_failure: false
          comment: true
          updateComment: true

      # Every module, every counter, current value. madrapps/jacoco-report was here first and only
      # reported modules containing changed files -- one row, and a red mark on a module at 99%.
      # Never gates: the jacocoTestCoverageVerification steps above are the real floors.
      - name: Coverage table
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          ./gradlew coverageFloors -q > floors.csv || true
          python3 - <<'PY' > coverage.md
          import glob, os, xml.etree.ElementTree as ET

          COUNTERS = ["INSTRUCTION", "BRANCH", "LINE", "COMPLEXITY", "METHOD", "CLASS"]
          PATTERNS = [
              "*/build/reports/jacoco/*/*.xml",
              "composeApp/src/jvmMain/appResources/common/*/build/reports/jacoco/*/*.xml",
          ]

          # The floor as the verification task itself has it, so the cap reported is the cap enforced.
          floors = {}
          if os.path.exists("floors.csv"):
              for line in open("floors.csv"):
                  parts = line.strip().split(",")
                  if len(parts) == 4 and parts[0] == "FLOOR":
                      floors.setdefault(parts[1], {})[parts[2]] = float(parts[3]) * 100

          # Only modules that actually produced a report in THIS run. The sub-builds are gated on
          # their own directories, so a run that skipped them simply has no section for them.
          found = {}
          for pattern in PATTERNS:
              for path in glob.glob(pattern):
                  module = os.path.basename(path.split("/build/reports/jacoco/")[0])
                  try:
                      root = ET.parse(path).getroot()
                  except ET.ParseError:
                      continue
                  ratios = {}
                  for c in root.findall("counter"):
                      missed, covered = int(c.get("missed")), int(c.get("covered"))
                      total = missed + covered
                      if total:
                          ratios[c.get("type")] = 100 * covered / total
                  if ratios:
                      found[module] = ratios

          print("<!-- coverage-table -->")
          print("## Coverage")
          if not found:
              print()
              print("No JaCoCo reports were produced in this run.")
          for module in sorted(found, key=lambda m: (m != "composeApp", m)):
              ratios = found[module]
              print()
              print(f"### {module}")
              print()
              print("| Counter | Floor | Actual |")
              print("|---|---|---|")
              for counter in COUNTERS:
                  if counter not in ratios:
                      continue
                  floor = floors.get(module, {}).get(counter)
                  cap = "" if floor is None else f"{floor:.0f}%"
                  print(f"| {counter.title()} | {cap} | {ratios[counter]:.2f}% |")
          if found:
              print()
              print("Modules whose tests did not run in this build are not listed. The floors are")
              print("enforced by the `jacocoTestCoverageVerification` steps, not by this table.")
          PY

          # Upsert: one comment per pull request, found by the marker on its first line.
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
                 --jq '.[] | select(.body | startswith("<!-- coverage-table -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/$id" -F body=@coverage.md >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@coverage.md >/dev/null
          fi
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            composeApp/build/reports/tests/
            composeApp/build/test-results/
            converter/build/reports/tests/
            converter/build/test-results/
            theme/build/reports/tests/
            theme/build/test-results/
            core-models/build/reports/tests/
            core-models/build/test-results/
            composeApp/src/jvmMain/appResources/common/*/build/reports/tests/
            composeApp/src/jvmMain/appResources/common/*/build/test-results/
