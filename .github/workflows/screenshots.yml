name: Screenshots

# Renders the presenter surfaces the congregation actually sees and posts the visual difference
# against the base branch as a PR comment.
#
# Deliberately NOT part of the `test` workflow, for two reasons:
#
#   * `test` is the required status check on main. A visual difference is not a failure — a
#     deliberate design change looks exactly like a regression — so it must never be able to block
#     a merge. This workflow is advisory and its check is not required.
#   * reg-actions needs write access to pull requests and to the repository, which `test`
#     deliberately does not have (`contents: read`).
#
# **The images ARE committed**, under `composeApp/screenshots`, so a reviewer can open and approve
# what is on screen rather than take the diff on trust. This job is a second, independent view of
# the same thing: it records the branch's images and reg-actions diffs them against the base
# branch's, which it keeps on a `reg_actions` branch of its own. Note the record step below
# overwrites the working copy before reg-actions reads it, so the comparison is always between two
# fresh renders — the committed copies are for humans, not for this job.
#
# Skia renders text differently on macOS, Windows and Linux (the same reason AGENT.md tells tests to
# assert invariants rather than pixels), so the committed images are right for whoever recorded them
# and differ everywhere else. Record on ONE platform per branch, and re-record only what actually
# changed — a re-record on a second OS rewrites nearly every file for nothing.
#
# To update the website's screenshots, download the `screenshots` artifact from a run on `main`
# rather than recording locally — those are the Linux renders, and they are consistent with each
# other. The website's homepage also wants a retina render of the same handful of surfaces, which
# is what the `screenshots-2x` artifact below is for — see the 2x steps for which classes and why.
#
# Images are matched between the two sides by their path **relative to `image-directory-path`**, so
# a capture written outside that root is not reported as changed — it silently stops being compared.
# `ScreenshotSupport.SCREENSHOT_ROOT` is the single place that root is defined.
on:
  push:
    branches: [main]
  # Draft pull requests run nothing; `ready_for_review` renders them once one is marked ready. The
  # first step of the job cancels a draft's run, for the reason given in test.yml.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  # reg-actions stores its baseline on a `reg_actions` branch it creates and pushes to — NOT as a
  # workflow artifact, which is what this said before. With `contents: read` it failed every run
  # with "couldn't find remote ref reg_actions" followed by a 403, so the baseline never existed
  # and the check was permanently red.
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: screenshots-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Cancels itself on a draft rather than skipping -- see the first step of test.yml's `test`.
      - name: Stop if the pull request is still a draft
        if: github.event_name == 'pull_request' && github.event.action != 'ready_for_review'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" = "true" ]; then
            gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || true
            sleep 120
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Only the screenshot class: the rest of the suite is the `test` workflow's job and would
      # add ~14 minutes here for nothing.
      #
      # 35, not 20. A green run of this step lands at 13-14.5 minutes, so the old ceiling left barely
      # five minutes of slack and killed the step twice -- once on a pull request, once on main --
      # without either being a real failure. The budget is not an alarm on how long the suite takes;
      # the job's own `timeout-minutes` below is the backstop for a genuine hang, and the per-class
      # log lines the build now prints will name the offender if that is what it turns out to be.
      - name: Render screenshots
        timeout-minutes: 35
        run: ./gradlew :composeApp:recordRoborazziJvm --tests '*ScreenshotTest*'

      # So the rendered set can be fetched without running Gradle locally, and the source the
      # website's screenshots should be taken from — not because the images are uncommitted (they
      # are committed, under composeApp/screenshots, and AGENT.md is emphatic that they stay that
      # way), but because these are the Linux renders and so are consistent with each other, which
      # a set recorded on someone's macOS checkout is not. Uploaded before the comparison so a
      # visual difference, which is advisory and never fails the job, cannot cost the artifact.
      - name: Upload the rendered screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: composeApp/screenshots
          retention-days: 30
          if-no-files-found: error

      # Retina renders for the website's homepage only — the wiki and blog take the 1x capture
      # above regardless of screen density (see import-screenshots.mjs in ChurchPresenter-Website).
      # Limited to the classes behind the seven homepage images so this doesn't re-run the other
      # ~20 AppPreview* tests a second time for output nothing reads. -PpreviewDensity=2 writes to
      # the SAME filenames under composeApp/screenshots (roborazzi.outputDir has no density-aware
      # naming), so this overwrites just those files in the working copy with the 2x version.
      - name: Render homepage screenshots at 2x
        timeout-minutes: 10
        run: |
          ./gradlew :composeApp:recordRoborazziJvm -PpreviewDensity=2 \
            --tests '*AppPreviewBibleScreenshotTest' \
            --tests '*AppPreviewSongsScreenshotTest' \
            --tests '*AppPreviewCanvasScreenshotTest' \
            --tests '*AppPreviewQAScreenshotTest' \
            --tests '*AppPreviewPresentationScreenshotTest' \
            --tests '*AppPreviewMediaScreenshotTest' \
            --tests '*ScheduleTabScreenshotTest'

      # Uploads the whole tree, same as the 1x artifact above — simpler than teasing out just the
      # seven changed files, and the website's importer only ever reads specific paths from this by
      # name, so the untouched (still-1x) files alongside them are inert.
      - name: Upload the 2x screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-2x
          path: composeApp/screenshots
          retention-days: 30
          if-no-files-found: error

      # Puts the working copy back to the 1x renders the step above overwrote, so reg-actions below
      # compares against the same density the committed baseline and the `screenshots` artifact use.
      - name: Restore homepage screenshots to 1x
        run: |
          ./gradlew :composeApp:recordRoborazziJvm \
            --tests '*AppPreviewBibleScreenshotTest' \
            --tests '*AppPreviewSongsScreenshotTest' \
            --tests '*AppPreviewCanvasScreenshotTest' \
            --tests '*AppPreviewQAScreenshotTest' \
            --tests '*AppPreviewPresentationScreenshotTest' \
            --tests '*AppPreviewMediaScreenshotTest' \
            --tests '*ScheduleTabScreenshotTest'

      - name: Compare with the base branch
        uses: reg-viz/reg-actions@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Where the record step above writes — `roborazzi.outputDir` in composeApp/build.gradle.kts
          # and `ScreenshotSupport.SCREENSHOT_ROOT` both point here. Committed, so a local re-record
          # also updates what is in git.
          image-directory-path: ./composeApp/screenshots
          # Every changed image is shown in the comment; with a handful of surfaces there is no
          # reason to make a reviewer expand a details block to see what moved.
          comment-report-format: raw
          # Edits the existing comment in place instead of stacking one per push, and marks it
          # resolved once a difference is fixed.
          outdated-comment-action: update
          # How long a run's images stay on the `reg_actions` branch, which is where the pictures
          # in the comment above are served from — so this is how long an old comment keeps them.
          # **This is the only place that window is set.** The action prunes expired directories
          # itself on its next run; nothing else decides what the branch holds.
          #
          # Below the default of 30 because the cost is uneven: an ordinary run stores only what
          # changed (~1 MB), but one that moves the whole set stores actual+expected+diff for all
          # 247 images at once — which is what a cross-platform re-record does, and what took the
          # branch past 500 MB in its first nine days.
          #
          # Note this prunes files, not history, so it alone never shrinks the pack — see
          # .github/workflows/reg-actions-prune.yml.
          retention-days: 14
