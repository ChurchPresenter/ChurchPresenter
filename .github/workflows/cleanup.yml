name: Cleanup

# Everything that keeps the repository's Actions storage in check, in one place:
#
#   prune-screenshots     daily, 04:17 UTC     the screenshot workflow's artifacts
#   collapse-reg-actions  monthly, the 1st     the `reg_actions` branch's history
#   storage               by hand only         old artifacts, runs and logs, and the caches
#
# Run any of the three by hand from the Actions tab: choose it as `task`. Every one honours
# `dry_run`, which lists what it would do and changes nothing.
#
# What is not here: every other artifact expires on its own (`retention-days` on its upload,
# 2-30 days), workflow runs and logs after GitHub's 90 days, and the Gradle caches are kept small by
# writing them from one job only (see `cache-read-only` in the workflows).
#
# ── prune-screenshots ──
#
#   The screenshot workflow uploads a `reg` report (reg-actions) and the `screenshots*` renders on
#   every push. reg-actions passes no retention, so its `reg` artifact keeps the repository default
#   of 90 days -- its `retention-days` input in screenshots.yml only prunes the `reg_actions` branch --
#   and at 90-180 MB a push that came to over 100 GB. Only a branch's latest run is worth looking at,
#   so this keeps the newest two of each artifact per branch that still exists -- the latest and the
#   one before, to compare against -- and deletes the rest every day, including everything from a
#   branch that has been merged and deleted.
#
#   Only the screenshot workflow's artifacts (`reg`, `screenshots*`). Workflow runs, logs and every
#   other artifact are left alone.
#
# ── collapse-reg-actions ──
#
#   Keeps the `reg_actions` branch's *history* from growing forever. Which run directories live on
#   that branch is not decided here — see `retention-days` on the reg-actions step in
#   `screenshots.yml`, which is the action's own setting and the only place to change the window.
#
#   The two are separate problems and it matters that they stay separate. reg-actions prunes expired
#   directories itself, but it does so with `git add -A` and a normal commit, so every earlier commit
#   still references the blobs of every run ever recorded. Deleting the files reclaims nothing: the
#   pack only shrinks if the history goes too. Measured 2026-08-15, nine days after the branch was
#   created, with the default 30-day retention that had not yet expired anything: 123 commits and
#   549.7 MB, against 206.3 MB for the whole of `main`.
#
#   So this rebuilds the branch as a single root commit holding **exactly what the tip already has**.
#   It applies no policy of its own and drops no directory the action meant to keep, which is why it
#   can run on a blunt schedule without coordinating with anything.
#
#   What it costs: the inline images in reg-actions PR comments are served from this branch by URL.
#   Collapsing history does not remove any file the tip still has, so live comments keep their
#   pictures; only directories the action itself already expired become unrecoverable. The images
#   reviewers actually approve are committed under `composeApp/screenshots` and are untouched.
#
#   Note the branch is NOT the comparison baseline, despite the name suggesting it. reg-actions
#   resolves the expected images from the workflow *artifact* attached to the run matching the
#   merge-base commit (`findRunAndArtifact` in the action's `run.ts`); the branch only hosts images
#   for the comment. Nothing here can affect whether a comparison works.
#
# ── storage ──
#
#    Old artifacts (older than `max_age_days`, or every one with `delete_all`), and -- only when
#    asked -- old workflow runs with their logs (`include_runs`) and every Gradle cache
#    (`clear_caches`). Runs and caches are opt-in: deleting runs cannot be undone, and clearing the
#    caches makes the next CI runs start cold.

on:
  schedule:
    - cron: '17 4 * * *'   # daily, 04:17 UTC: prune-screenshots
    # Monthly, off-peak UTC: collapse-reg-actions. It only has to outpace pack growth, and each
    # run rewrites the branch, so there is no reason to do it often.
    - cron: '47 4 1 * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'What to run'
        required: true
        default: storage
        type: choice
        options: [storage, prune-screenshots, collapse-reg-actions]
      dry_run:
        description: 'List what would happen without changing anything'
        required: false
        default: true
        type: boolean
      keep:
        description: 'prune-screenshots: how many of each artifact to keep per branch, newest first'
        required: false
        default: '2'
        type: number
      max_age_days:
        description: 'storage: delete what is older than this many days'
        required: false
        default: '2'
        type: number
      delete_all:
        description: 'storage: ignore the age and delete every artifact (and run, if included)'
        required: false
        default: false
        type: boolean
      include_runs:
        description: 'storage: also delete old workflow runs and their logs (cannot be undone)'
        required: false
        default: false
        type: boolean
      clear_caches:
        description: 'storage: also clear every Gradle cache (the next CI runs start cold)'
        required: false
        default: false
        type: boolean

# Nothing at the top: each job asks for exactly what it needs.
permissions: {}

jobs:
  prune-screenshots:
    if: github.event.schedule == '17 4 * * *' || inputs.task == 'prune-screenshots'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete all but the newest screenshot artifacts per branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const keep = Number('${{ inputs.keep || 2 }}');
            const dryRun = '${{ inputs.dry_run || false }}' === 'true';
            const isScreenshotArtifact = (name) => name === 'reg' || name.startsWith('screenshots');

            // Collect everything first, then delete: deleting while paging shifts the pages.
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            }, (response) => response.data.filter(a => !a.expired && isScreenshotArtifact(a.name)));

            // A branch that is gone has been merged or abandoned: none of its artifacts are kept.
            const branches = new Set(await github.paginate(github.rest.repos.listBranches, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            }, (response) => response.data.map(b => b.name)));

            const groups = new Map();
            for (const a of artifacts) {
              const key = `${a.name} @ ${a.workflow_run?.head_branch ?? '?'}`;
              if (!groups.has(key)) groups.set(key, []);
              groups.get(key).push(a);
            }

            let count = 0;
            let bytes = 0;
            for (const [key, list] of groups) {
              list.sort((x, y) => new Date(y.created_at) - new Date(x.created_at));
              const branchExists = branches.has(list[0].workflow_run?.head_branch);
              const stale = branchExists ? list.slice(keep) : list;
              const kept = list.length - stale.length;
              if (stale.length > 0) console.log(`${key}: keeping ${kept}, removing ${stale.length}`);
              for (const a of stale) {
                count++;
                bytes += a.size_in_bytes;
                if (!dryRun) {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: a.id,
                  });
                }
              }
            }
            const gb = (bytes / 1024 ** 3).toFixed(1);
            console.log(`${dryRun ? 'Would delete' : 'Deleted'} ${count} artifact(s), ${gb} GB`);

  collapse-reg-actions:
    if: github.event.schedule == '47 4 1 * *' || inputs.task == 'collapse-reg-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # To check whether a Screenshots run is in flight before force-pushing — see the pre-flight step.
      actions: read
    # One at a time, and never cancel one midway: it force-pushes, so a half-run is worse than a
    # late one.
    concurrency:
      group: reg-actions-collapse
      cancel-in-progress: false
    steps:
      # Concurrent Screenshots runs are fine with each other: each writes to its own
      # `<date>_<runId>_reg` directory, so their commits touch disjoint paths, and the action
      # rebases and retries on a non-fast-forward push. This job is the one thing that rewrites
      # rather than appends, so it is the one thing that has to stay out of their way.
      #
      # Waiting for a quiet moment is belt-and-braces on top of --force-with-lease below: the lease
      # makes a collision safe, this makes it unlikely. Neither is load-bearing for correctness —
      # a run that does lose its upload still reports the right comparison, because that is
      # computed from the artifact and not from this branch, and it re-uploads on the PR's next
      # push anyway.
      - name: Wait for any in-flight Screenshots run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            active=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/screenshots.yml/runs?status=in_progress&per_page=1" \
              --jq '.total_count' 2>/dev/null || echo 0)
            queued=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/screenshots.yml/runs?status=queued&per_page=1" \
              --jq '.total_count' 2>/dev/null || echo 0)
            if [ "$active" = "0" ] && [ "$queued" = "0" ]; then
              echo "No Screenshots run in flight."
              exit 0
            fi
            echo "Screenshots busy (in_progress=$active queued=$queued); waiting (attempt $attempt/10)."
            sleep 60
          done
          echo "Still busy after 10 minutes — going ahead; --force-with-lease makes this safe."

      # No actions/checkout: the working tree is never needed. The new commit is assembled with
      # plumbing from the fetched tree, which avoids materialising a few hundred MB of PNGs.
      - name: Rebuild the branch as a single root commit
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          git init -q work
          cd work
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Re-read and rebuild on each attempt. A Screenshots run that lands between the fetch and
          # the push trips the lease; the answer is to start again from its commit, not to give up
          # for a month or to push over it.
          for attempt in $(seq 1 5); do
            rm -rf .git/shallow
            git fetch -q --prune --depth=2 origin reg_actions 2>/dev/null || {
              echo "No reg_actions branch yet — reg-actions creates it on its next run."
              exit 0
            }
            OLD=$(git rev-parse FETCH_HEAD)

            # Depth 2, not 1. The tip's whole tree comes with either, and that is all that is
            # reused below — but under --depth=1 a commit has no parent present whether or not it
            # has one, so a branch already collapsed to a root commit is indistinguishable from a
            # shallow fetch of a long history. At depth 2 the commit count tells them apart.
            if [ "$(git rev-list --count FETCH_HEAD)" = "1" ]; then
              echo "Tip is already a root commit. Nothing to collapse."
              exit 0
            fi

            TREE=$(git rev-parse FETCH_HEAD^{tree})
            ENTRIES=$(git ls-tree FETCH_HEAD | wc -l)
            echo "Attempt $attempt: collapsing to a root commit over $ENTRIES top-level entries."

            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "Dry run: would collapse $(git rev-list --count FETCH_HEAD)+ commits into one. Nothing pushed."
              exit 0
            fi

            NEW=$(git commit-tree "$TREE" \
              -m "Collapse reg_actions history" \
              -m "Rebuilt as a root commit over the $ENTRIES top-level entries the branch already had. No directory is dropped here; retention is the reg-actions step's retention-days in screenshots.yml." \
              -m "See .github/workflows/cleanup.yml for why deleting files alone never shrinks the pack.")

            # --force-with-lease so a run that pushed since the fetch is never silently clobbered:
            # the push is refused and the loop rebuilds on top of whatever it wrote.
            if git push --force-with-lease=refs/heads/reg_actions:"$OLD" \
                 origin "$NEW:refs/heads/reg_actions"; then
              echo "Collapsed. Tree unchanged; history is now one commit."
              exit 0
            fi

            echo "Branch moved under us — refetching and retrying."
            sleep $((attempt * 15))
          done

          echo "Could not collapse: the branch kept moving. Harmless, and the next run retries." >&2
          exit 1

  storage:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'storage'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old artifacts, runs and caches
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const deleteAll = ${{ inputs.delete_all || false }};
            const maxAgeDays = Number('${{ inputs.max_age_days || 2 }}');
            const includeRuns = ${{ inputs.include_runs || false }};
            const clearCaches = ${{ inputs.clear_caches || false }};
            const dryRun = ${{ inputs.dry_run || false }};
            const cutoff = new Date(Date.now() - maxAgeDays * 24 * 60 * 60 * 1000);
            const old = (date) => deleteAll || new Date(date) < cutoff;
            const verb = dryRun ? 'Would delete' : 'Deleted';
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            console.log(deleteAll ? 'Everything, whatever its age' : `Older than ${maxAgeDays} day(s), before ${cutoff.toISOString()}`);
            if (dryRun) console.log('DRY RUN: nothing is deleted');

            // Every list is read whole first, then deleted from: the API lists newest first, so a
            // loop that stops at the first page without anything old in it never reaches the old ones.
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo,
              { ...repo, per_page: 100 }, (r) => r.data.filter((a) => !a.expired && old(a.created_at)));
            let bytes = 0;
            for (const a of artifacts) {
              bytes += a.size_in_bytes;
              if (!dryRun) await github.rest.actions.deleteArtifact({ ...repo, artifact_id: a.id });
            }
            console.log(`${verb} ${artifacts.length} artifact(s), ${(bytes / 1024 ** 3).toFixed(2)} GB`);

            if (includeRuns) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo,
                { ...repo, per_page: 100 },
                (r) => r.data.filter((run) => run.id !== context.runId && old(run.created_at)));
              for (const run of runs) {
                if (!dryRun) await github.rest.actions.deleteWorkflowRun({ ...repo, run_id: run.id });
              }
              console.log(`${verb} ${runs.length} workflow run(s) and their logs`);
            }

            if (clearCaches) {
              const caches = await github.paginate(github.rest.actions.getActionsCacheList,
                { ...repo, per_page: 100 }, (r) => r.data);
              let cacheBytes = 0;
              for (const c of caches) {
                cacheBytes += c.size_in_bytes;
                if (!dryRun) await github.rest.actions.deleteActionsCacheById({ ...repo, cache_id: c.id });
              }
              console.log(`${verb} ${caches.length} cache(s), ${(cacheBytes / 1024 ** 3).toFixed(2)} GB`);
            }
