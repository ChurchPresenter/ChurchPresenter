# Weekly version-update pull requests. Security updates are separate: they follow the dependency
# graph `test.yml`'s `dependencies` job submits, and open as soon as an advisory lands.
#
# Gradle versions all live in gradle/libs.versions.toml, so one directory covers every module.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # Low, so a backlog held behind the limit never arrives as a wall of PRs at once.
    open-pull-requests-limit: 5
    groups:
      # Kotlin and Compose move together; a lone bump of one breaks the build.
      kotlin-compose:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.compose*"
          - "androidx.compose*"
      # Every other minor and patch update, as one PR a week. A dependency lands in the first
      # group that matches, so Kotlin and Compose stay in theirs. Majors are not grouped: each
      # opens its own PR. VLC and the bundled Chromium are left out too -- their updates change
      # native code and need a hand test in the running app, so they come one at a time.
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "uk.co.caprica:vlcj*"
          - "me.friwi:jcefmaven"
        update-types: ["minor", "patch"]
    ignore:
      # Material3 has had no stable release since 1.9.0; the alpha in use is the one paired with
      # the Compose Multiplatform release in use, and a newer alpha drags all of Compose onto
      # alphas with it. It moves by hand, together with Compose Multiplatform.
      - dependency-name: "org.jetbrains.compose.material3*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # okhttp is held at 4.x for the socket.io client the captions and the Bible engine connect
      # with (see the root build); no test drives a live socket.io connection over 5.x.
      - dependency-name: "com.squareup.okhttp3:okhttp"
        update-types: ["version-update:semver-major"]
      # PDFBox 3 rewrote the API the PDF import and rendering are built on; moving to it is a
      # change of its own, not a version bump.
      - dependency-name: "org.apache.pdfbox:*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
