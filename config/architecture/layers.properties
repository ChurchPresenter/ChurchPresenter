# The layer of every module of the build, read by `./gradlew checkModuleLayers`. A module missing
# from this file fails the check, so a new module is placed on purpose. What each layer may depend
# on is in the root build.gradle.kts and in AGENT.md, "Layers".
#
#   foundation   shared building blocks that know no feature
#   engine       protocols, file formats, rendering: what a feature or an output is built on
#   feature      a tab or a window, with its view model
#   output       the live output pipeline
#   integration  what ties features together: the remote server, the settings pages, the dialogs
#   app          the app itself

theme=foundation
strings=foundation
icons=foundation
diagnostics=foundation
core-models=foundation
settings=foundation
shared-ui=foundation
bible=foundation
song-chords=foundation
show-control=foundation
control-in=foundation

bible-engine=engine
bible-formats=engine
presentation-engine=engine
atem=engine
ndi=engine
omt=engine
companion-satellite=engine
live-show=engine
lottieGenerator=engine
presenter=engine
calendar-core=engine
output-api=engine
output-guard=engine
# A detekt plugin, on no classpath of the app: it depends on nothing in this build.
detekt-rules=foundation
slides-engine=engine
media-engine=engine
canvas-engine=engine
lower-third-engine=engine
web-engine=engine
stt-engine=engine

songs=feature
bible-tab=feature
slides=feature
media=feature
web=feature
qa=feature
stt=feature
announcements=feature
lower-third=feature
canvas=feature
schedule=feature
calendar=feature
dictionary=feature
crossword=feature
crossword-tab=feature
companion-surface=feature
helper=feature
converter=feature
songlibrary=feature
planning-center=feature
statistics=feature
updater=feature
obs=feature

live-output=output

server=integration
server-ui=integration
profiles=integration
dialogs=integration
app-settings=integration
telemetry=integration

composeApp=app
