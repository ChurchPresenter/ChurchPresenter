# The cloudflared release the tunnel downloads, and the SHA-256 of each platform's asset in it.
#
# TunnelManager fetches https://github.com/cloudflare/cloudflared/releases/download/<version>/<asset>,
# checks the bytes against the digest below before anything is written where it can run, and
# refuses the tunnel on a mismatch. A binary installed from an earlier pin is replaced on next start.
#
# NEVER point this at "latest": a rolling asset changes under a fixed digest and every machine then
# fails verification at once. To move the pin, take the digests from the release's own assets:
#   gh api repos/cloudflare/cloudflared/releases/tags/<version> --jq '.assets[] | "\(.name) \(.digest)"'
version=2026.9.3
cloudflared-windows-amd64.exe=f096265ec2fcbe9bb6e2d64268db167ced3fcbb83d894bdb9e2fcdb26f2ea7e2
cloudflared-darwin-arm64.tgz=587c2cfb1c230fe36c7fa7727da78be459dae028cabe8c001291999350f07095
cloudflared-darwin-amd64.tgz=d1155d0837487f261183b15c1eab6c4ebcad9dc49b94675f1524c3564cea3977
cloudflared-linux-arm64=aaeb2d7d0da3614634c7e03ab13487a1522c2e79165ed2929cfe23d5e95b326d
